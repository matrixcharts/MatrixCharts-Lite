<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MatrixCharts interaction invariants</title>
<style>
    body { margin: 0; background: #0d1117; color: #e6edf3; font: 13px system-ui, sans-serif; }
    #chart { width: 1200px; height: 600px; }
</style>
</head>
<body>
<div id="chart"></div>
<script type="module">
// Interaction invariants, driven by scripts/check-interaction.cjs.
//
// This page exists to hold a chart with a *gapped* series and hand the runner a
// handle on it. The assertions live in the runner rather than here because they have
// to dispatch real wheel and drag events, and because a failing assertion has to be
// legible in a terminal rather than in a console nobody reads.
//
// The invariant under test: a bar that is under the pointer stays under the pointer.
// That is the whole of "feels natural" as a number, and it is the one property that a
// range or count assertion cannot see — a chart can report the right number of bars
// and still be sliding sideways under the cursor.
import { Chart } from '../../src/index.ts';
import { MockCandleSource } from '../../src/feed/MockCandleSource.ts';

const MINUTE = 60_000;

// A gapped series: 30 bars to a session, then a 17-hour close. Long enough that a
// break is a visible fraction of the plot rather than a rounding error, and several
// of them, so a drift accumulates instead of hiding inside one.
const source = new MockCandleSource(300, 100_000, 30);
const chart = new Chart(document.getElementById('chart'), { timeScale: { barSpacing: 12 } });

// Start before awaiting. Subscribing, then starting, then awaiting a promise the
// subscriber resolves is the only order that terminates: the alternative — await the
// snapshot, then start — waits forever for an event only `start` can emit.
let resolveSnapshot;
const loaded = new Promise((resolve) => { resolveSnapshot = resolve; });
source.subscribe((message) => {
    if (message.type === 'snapshot') {
        chart.setData(message.candles);
        resolveSnapshot();
    }
}, () => undefined);
source.start();
await loaded;

// A recorder for the text the 2D layer actually drew, and for the lines it stroked.
//
// The headless stub reports a `measureText` width of zero, so nothing about label layout
// can be asserted there — which is how a time axis reading `Sep 1, 01:30 PM  Sep 1 Sep 1
// ...` survived a green suite: the defect is entirely about the width of the text, and
// the only place a width exists is a browser. Installed before the chart is constructed
// so the very first frame is recorded too.
const drawn = { labels: [], lines: [], rects: [] };
const proto = CanvasRenderingContext2D.prototype;
const realFillText = proto.fillText;
const realFillRect = proto.fillRect;
const realStroke = proto.stroke;
// One sequence across every record, because a label has to be paired with a chip that was
// painted *before* it. `drawTag` draws the text twice — once as a plain axis label and
// again over its own filled box — and pairing by geometry alone matches the first of those
// against the second one's box, which reports a catastrophic contrast ratio for a chip that
// is in fact perfectly legible.
let sequence = 0;
proto.fillText = function (text, x, y) {
    // The fill in force is the text's own colour, and recording it is what lets the runner
    // measure whether that text is legible against the chip it was drawn on. A defect
    // reported as "the badge text is not visible" is not a wrong value anywhere — it is a
    // correct colour that nobody chose against its background, and the only way to see it
    // is to have both numbers.
    drawn.labels.push({ text: String(text), x, y, fill: String(this.fillStyle), seq: sequence++ });
    return realFillText.call(this, text, x, y);
};
proto.fillRect = function (x, y, w, h) {
    drawn.rects.push({ x, y, w, h, fill: String(this.fillStyle), seq: sequence++ });
    return realFillRect.call(this, x, y, w, h);
};
proto.stroke = function () {
    // A stroke is only recorded when a path is pending, so the calls that merely close a
    // path do not add a phantom line.
    if (this.__mcPath) drawn.lines.push(this.__mcPath.slice());
    return realStroke.call(this);
};
for (const method of ['moveTo', 'lineTo']) {
    const real = proto[method];
    proto[method] = function (x, y) {
        (this.__mcPath ??= []).push([x, y]);
        return real.call(this, x, y);
    };
}
const realBeginPath = proto.beginPath;
proto.beginPath = function () {
    this.__mcPath = [];
    return realBeginPath.call(this);
};

// The runner drives real events, so it needs the plot's box in CSS pixels and a
// handle on the chart itself.
globalThis.__mc = {
    chart,
    source,
    drawn,
    // Parses what a canvas reports back for `fillStyle` into channels 0-to-1, so the runner
    // can compute a contrast ratio without re-implementing a colour parser.
    //
    // Both forms, because a canvas does not hand back what was written to it: assigning
    // `rgba(233, 237, 242, 1)` and reading it again yields `#e9edf2`, and a parser that
    // only understood the `rgb()` form silently measures nothing — which is exactly what
    // the first version of this did, reporting "no chip text was found" for a frame that
    // was covered in chips.
    rgb: (value) => {
        const hex = /^#([0-9a-f]{6})([0-9a-f]{2})?$/i.exec(value);
        if (hex !== null) {
            const part = (i) => parseInt(hex[1].substr(i * 2, 2), 16) / 255;
            return [part(0), part(1), part(2), hex[2] === undefined ? 1 : parseInt(hex[2], 16) / 255];
        }
        const match = /rgba?\(([^)]+)\)/.exec(value);
        if (match === null) return null;
        const parts = match[1].split(',').map((part) => parseFloat(part));
        return [parts[0] / 255, parts[1] / 255, parts[2] / 255, parts.length > 3 ? parts[3] : 1];
    },
    // Measured with the chart's own font, so a width is the width the renderer used.
    labelWidth: (text) => {
        const ctx = document.createElement('canvas').getContext('2d');
        ctx.font = '11px sans-serif';
        return ctx.measureText(text).width;
    },
    timeAxisHeight: () => chart.options().layout.timeAxisHeight,
    plot: () => {
        const r = document.querySelector('canvas').getBoundingClientRect();
        return { x: r.x, y: r.y, width: r.width, height: r.height };
    },
    count: () => chart.getCandleCount(),
    // indexToCoordinate is the public read API, so the assertion is written against
    // the same call a caller would make rather than against internals.
    xOf: (index) => chart.indexToCoordinate(index),
    indexAt: (x) => chart.coordinateToNearestIndex(x),
    spacing: () => chart.options().timeScale.barSpacing,
    // The gesture seam, for the runner's claim invariants.
    //
    // A handler that claims everything and one that claims nothing, so the runner can
    // drive the *same* real drag twice and assert the two produce different geometry.
    // Asserting only the claimed case would pass with a seam that claims unconditionally;
    // asserting only the unclaimed case would pass with no seam at all.
    claimAll: (on) => {
        if (on) chart.setPointerClaimHandler(() => true);
        else chart.setPointerClaimHandler(() => false);
    },
    // Painter call count, so the runner can assert `redraw()` reaches the caller's layer.
    // A real 2D context is in play here, so unlike the headless stub the painter is
    // genuinely invoked — which is what makes this the end-to-end version of that test.
    paints: 0,
    installPainter: () => {
        globalThis.__mc.paints = 0;
        chart.setOverlayPainter(() => { globalThis.__mc.paints++; });
    },
    paintCount: () => globalThis.__mc.paints,
};
globalThis.__mcReady = true;
</script>
</body>
</html>
