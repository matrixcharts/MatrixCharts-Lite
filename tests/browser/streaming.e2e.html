                        for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
                            const c = at(x, y);
                            if (c.a > 16) footprint++;
                            if (!(c.a > 200 && c.r > 200 && c.g < 60 && c.b < 60)) continue;
                            frame++;
                            if (x > minX && x < maxX && y > minY && y < maxY) interior++;
                        }
                        result = {
                            w: maxX - minX + 1, h: maxY - minY + 1,
                            frame, interior, footprint,
                        };
                        return out;
                    };
                    await waitFrame();
                    chart.applyOptions({ crosshair: { visible: true } });
                    await waitFrame();
                    const measured = result;
                    measured.barSpacing = chart.getBarSpacing();
                    chart.destroy();
                    host.remove();
                    return measured;
                };

                const ratios = [];
                for (let r = 1; r <= 3.0001; r += 0.25) ratios.push(Math.round(r * 100) / 100);
                // The ratios that broke before: odd tenths and a half-steps.
                ratios.push(1.1, 1.15, 1.3, 1.7, 2.1, 2.3, 2.5, 2.75, 3.5, 4);

                const realRatio = window.devicePixelRatio;
                const frameFailures = [];
                let frameChecked = 0;
                for (const ratio of ratios) {
                    Object.defineProperty(window, 'devicePixelRatio', { configurable: true, value: ratio });
                    const on = await readBody(true);
                    const off = await readBody(false);
                    if (!on || !off) { frameFailures.push(`ratio ${ratio}: body not found`); continue; }
                    frameChecked++;
                    const perimeter = 2 * (on.w + on.h) - 4;
                    // A body can never be wider than the gap between bars. This is
                    // the invariant a wrong stride offset breaks: reading the
                    // neighbour's volume instead of its x turned a 1-index gap into
                    // a ~500-index one and drew a body across the whole plot, which
                    // the perimeter check alone reported only as a size mismatch.
                    // The comparison is in device pixels, like the measurement.
                    const deviceSpacing = on.barSpacing * ratio;
                    if (on.w > deviceSpacing + 1) {
                        frameFailures.push(
                            `ratio ${ratio}: body is ${on.w}px wide at a ${deviceSpacing}px bar gap`,
                        );
                    }
                    if (on.frame !== perimeter) {
                        frameFailures.push(
                            `ratio ${ratio}: frame ${on.frame}px, expected the ${perimeter}px perimeter of ${on.w}x${on.h}`,
                        );
                    }
                    if (on.interior > 0) {
                        frameFailures.push(`ratio ${ratio}: ${on.interior} frame pixels inside the body`);
                    }
                    if (on.w !== off.w || on.h !== off.h) {
                        frameFailures.push(`ratio ${ratio}: body bounds moved ${off.w}x${off.h} -> ${on.w}x${on.h}`);
                    }
                    if (on.footprint !== off.footprint) {
                        frameFailures.push(`ratio ${ratio}: footprint changed ${off.footprint} -> ${on.footprint}`);
                    }
                }
                Object.defineProperty(window, 'devicePixelRatio', { configurable: true, value: realRatio });
                if (frameChecked !== ratios.length) {
                    throw new Error(
                        `Pixel-ratio sweep measured ${frameChecked} of ${ratios.length} configurations.`,
                    );
                }
                if (frameFailures.length) {
                    throw new Error(`Border frame is not pixel-exact:\n  ${frameFailures.join('\n  ')}`);
                }
                borderPixelRatiosChecked = frameChecked;
            }

            // Grid toggles.
            optionsChart.applyOptions({ grid: { vertLines: false, horzLines: false } });
            assertEqual(optionsChart.options().grid.vertLines, false, 'grid vertLines');
            assertEqual(optionsChart.options().grid.horzLines, false, 'grid horzLines');

            optionsChart.destroy();
            optionsHost.remove();

            if (errors.length > 0) throw new Error(errors.join('\n'));

            // --- Public user events ------------------------------------------------
            // A dedicated host so pointer traffic cannot disturb the feed chart.
            const eventHost = document.createElement('div');
            eventHost.id = 'event-host';
            eventHost.style.cssText = 'position:fixed;left:20px;top:20px;width:600px;height:300px';
            document.body.appendChild(eventHost);
            const eventChart = new Chart(eventHost);
            // The wrapper is the single input surface, so pointer events must be
            // dispatched there. Dispatching on the container would never reach it.
            const eventSurface = eventHost.firstElementChild;
            if (!eventSurface) throw new Error('The event chart has no input surface.');
            const eventCandles = Array.from({ length: 30 }, (_, index) => ({
                time: baseTime + index * 60_000,
                open: 100 + index,
                high: 101 + index,
                low: 99 + index,
                close: 100.5 + index,
            }));
            eventChart.setData(eventCandles);
            await waitFrame();

            const moves = [];
            const clicks = [];
            const ranges = [];
            const unsubMove = eventChart.subscribeCrosshairMove((e) => moves.push(e));
            const unsubClick = eventChart.subscribeClick((e) => clicks.push(e));
            const unsubRange = eventChart.subscribeVisibleRangeChange((e) => ranges.push(e));

            const hostRect = () => eventHost.getBoundingClientRect();
            const hover = (x, y) => {
                const r = hostRect();
                eventSurface.dispatchEvent(new PointerEvent('pointermove', {
                    clientX: r.left + x, clientY: r.top + y, bubbles: true, pointerId: 7, pointerType: 'mouse',
                }));
            };
            const press = (x, y, id = 7) => {
                const r = hostRect();
                eventSurface.dispatchEvent(new PointerEvent('pointerdown', {
                    clientX: r.left + x, clientY: r.top + y, bubbles: true, pointerId: id, pointerType: 'mouse', button: 0,
                }));
            };
            const release = (x, y, id = 7) => {
                const r = hostRect();
                eventSurface.dispatchEvent(new PointerEvent('pointerup', {
                    clientX: r.left + x, clientY: r.top + y, bubbles: true, pointerId: id, pointerType: 'mouse', button: 0,
                }));
            };
            const drag = async (fromX, toX, steps = 6) => {
                press(fromX, 150);
                for (let step = 1; step <= steps; step++) {
                    const x = fromX + ((toX - fromX) * step) / steps;
                    const r = hostRect();
                    eventSurface.dispatchEvent(new PointerEvent('pointermove', {
                        clientX: r.left + x, clientY: r.top + 150, bubbles: true, pointerId: 7, pointerType: 'mouse',
                    }));
                }
                release(toX, 150);
                await waitFrame();
            };

            // 1. Hover reports the candle under the pointer, snapped to its centre.
            const targetIndex = 12;
            const targetX = eventChart.indexToCoordinate(targetIndex);
            const movesBefore = moves.length;
            hover(targetX + eventChart.getBarSpacing() * 0.4, 150);
            if (moves.length !== movesBefore + 1) {
                throw new Error(`Hover produced ${moves.length - movesBefore} crosshair events, expected 1.`);
            }
            const hovered = moves[moves.length - 1];
            if (!hovered.candle) throw new Error('Hover did not resolve a candle.');
            assertEqual(hovered.index, targetIndex, 'crosshair index');
            assertEqual(hovered.time, eventCandles[targetIndex].time, 'crosshair time');
            assertClose(hovered.candle.close, 100.5 + targetIndex, 'crosshair candle close');
            assertClose(hovered.x, eventChart.indexToCoordinate(targetIndex), 'crosshair x snaps to the bar centre');
            assertClose(hovered.price, eventChart.coordinateToPrice(150), 'crosshair price tracks the pointer y');
            assertEqual(hovered.y, 150, 'crosshair y follows the pointer');

            // 2. The same bar reached from either side resolves identically.
            const left = eventChart.indexToCoordinate(targetIndex) - eventChart.getBarSpacing() * 0.4;
            hover(left, 150);
            assertEqual(moves[moves.length - 1].index, targetIndex, 'crosshair snaps to the same bar from the left');

            // 3. Moving within the same bar does not re-notify.
            const movesBeforeIdle = moves.length;
            hover(targetX + eventChart.getBarSpacing() * 0.1, 150);
            assertEqual(moves.length, movesBeforeIdle, 'a move within one bar must stay silent');

            // 4. Leaving clears the crosshair.
            eventSurface.dispatchEvent(new PointerEvent('pointerleave', { bubbles: true, pointerId: 7, pointerType: 'mouse' }));
            const cleared = moves[moves.length - 1];
            assertEqual(cleared.candle, null, 'crosshair clears on leave');
            assertEqual(cleared.index, -1, 'cleared index is -1');
            assertEqual(cleared.x, null, 'cleared x is null');
            assertEqual(cleared.y, null, 'cleared y is null');
            assertEqual(cleared.time, null, 'cleared time is null');
            assertEqual(cleared.price, null, 'cleared price is null');
            const movesAfterLeave = moves.length;
            hover(targetX, 150);
            if (!moves[moves.length - 1].candle) throw new Error('Crosshair did not come back after re-entering.');

            // 5. A press and release without travel is a click.
            const clicksBefore = clicks.length;
            press(targetX, 150);
            release(targetX, 150);
            if (clicks.length !== clicksBefore + 1) {
                throw new Error(`A stationary press produced ${clicks.length - clicksBefore} clicks, expected 1.`);
            }
            const clicked = clicks[clicks.length - 1];
            assertEqual(clicked.index, targetIndex, 'click index');
            assertEqual(clicked.button, 0, 'click button');
            assertEqual(clicked.time, eventCandles[targetIndex].time, 'click time');
            if (!clicked.candle) throw new Error('Click did not carry a candle.');

            // 6. A drag is not a click, and it does report range changes.
            const clicksBeforeDrag = clicks.length;
            const rangesBeforeDrag = ranges.length;
            await drag(300, 120, 12);
            if (clicks.length !== clicksBeforeDrag) throw new Error('A pan was reported as a click.');
            if (ranges.length === 0) throw new Error('A pan produced no visibleRangeChange event.');
            const lastRange = ranges[ranges.length - 1];
            if (lastRange.logical.to <= lastRange.logical.from) throw new Error('Range event reported an empty visible range.');
            if (lastRange.logical.to > eventChart.getCandleCount()) throw new Error('Range event escaped the series.');
            assertClose(lastRange.barSpacing, eventChart.getBarSpacing(), 'range event bar spacing');
            assertEqual(lastRange.logical.to, eventChart.getVisibleLogicalRange().to, 'range event matches the read API');
            assertEqual(lastRange.logical.from, eventChart.getVisibleLogicalRange().from, 'range event from matches the read API');
            if (lastRange.time) {
                assertEqual(lastRange.time.from, eventChart.getCandleAt(lastRange.logical.from).time, 'range time from');
                assertEqual(lastRange.time.to, eventChart.getCandleAt(lastRange.logical.to - 1).time, 'range time to');
            }
            if (ranges.length - rangesBeforeDrag > 20) {
                throw new Error(`A 12-step drag produced ${ranges.length - rangesBeforeDrag} range events, expected coalescing.`);
            }

            // 7. A drag with no range change is silent.
            const rangesBeforeIdle = ranges.length;
            await drag(150, 150, 1);
            if (ranges.length !== rangesBeforeIdle) {
                throw new Error('A sub-pixel drag changed the visible range and should have been silent.');
            }

            // 8. Zooming reports a new bar spacing.
            const spacingBeforeZoom = eventChart.getBarSpacing();
            const rangesBeforeZoom = ranges.length;
            eventSurface.dispatchEvent(new WheelEvent('wheel', {
                deltaY: -100, clientX: hostRect().left + 300, clientY: hostRect().top + 150, bubbles: true, cancelable: true,
            }));
            await waitFrame();
            assertEqual(eventChart.getBarSpacing() > spacingBeforeZoom, true, 'wheel up zooms in');
            if (ranges.length <= rangesBeforeZoom) throw new Error('Zooming produced no visibleRangeChange event.');
            assertClose(ranges[ranges.length - 1].barSpacing, eventChart.getBarSpacing(), 'zoom range event spacing');

            // 9. Unsubscribing stops delivery and is safe to call twice.
            unsubMove();
            unsubMove();
            unsubClick();
            unsubRange();
            const movesBeforeUnsub = moves.length;
            const clicksBeforeUnsub = clicks.length;
            const rangesBeforeUnsub = ranges.length;
            hover(targetX - 60, 120);
            press(targetX - 60, 120);
            release(targetX - 60, 120);
            await waitFrame();
            eventSurface.dispatchEvent(new WheelEvent('wheel', {
                deltaY: -100, clientX: hostRect().left + 300, clientY: hostRect().top + 150, bubbles: true, cancelable: true,
            }));
            await waitFrame();
            assertEqual(moves.length, movesBeforeUnsub, 'unsubscribed crosshair handler kept firing');
            assertEqual(clicks.length, clicksBeforeUnsub, 'unsubscribed click handler kept firing');
            assertEqual(ranges.length, rangesBeforeUnsub, 'unsubscribed range handler kept firing');

            // 10. Handlers that subscribed again after destroy() are not called.
            const postDestroy = [];
            eventChart.subscribeCrosshairMove((e) => postDestroy.push(e));
            eventChart.subscribeClick((e) => postDestroy.push(e));
            eventChart.subscribeVisibleRangeChange((e) => postDestroy.push(e));
            const canvasCount = eventHost.querySelectorAll('canvas').length;
            eventChart.destroy();
            assertEqual(eventHost.querySelectorAll('canvas').length, 0, 'destroy() removed the layers');
            assertEqual(canvasCount, 3, 'the event chart had three layers');
            hover(targetX, 150);
            eventSurface.dispatchEvent(new PointerEvent('pointerdown', {
                clientX: hostRect().left + targetX, clientY: hostRect().top + 150, bubbles: true, pointerId: 9, pointerType: 'mouse', button: 0,
            }));
            eventSurface.dispatchEvent(new PointerEvent('pointerup', {
                clientX: hostRect().left + targetX, clientY: hostRect().top + 150, bubbles: true, pointerId: 9, pointerType: 'mouse', button: 0,
            }));
            await waitFrame();
            if (postDestroy.length > 0) {
                throw new Error(`A destroyed chart called ${postDestroy.length} handler(s).`);
            }
            eventHost.remove();

            // The feed-driven chart was deliberately panned into history above to
            // check anchor preservation. Put it back on the live edge, which is
            // the state a fresh integrator sees, and measure its own pixels.
            chart.setData(snapshot);
            await waitFrame();

            const feedRange = chart.getVisibleLogicalRange();
            const feedTimeRange = chart.getVisibleTimeRange();
            if (feedRange.to !== chart.getCandleCount()) {
                throw new Error('setData did not restore the live edge, so the newest bar is not visible.');
            }
            if (feedRange.from <= 0) {
                throw new Error('setData did not fit the series, so the oldest bar is not visible.');
            }
            if (chart.getCandleAt(feedRange.from).time !== feedTimeRange.from) {
                throw new Error('Feed chart logical and time ranges disagree at the left edge.');
            }
            if (chart.getCandleAt(feedRange.to - 1).time !== feedTimeRange.to) {
                throw new Error('Feed chart logical and time ranges disagree at the right edge.');
            }
            // floor at the left edge and ceil at the right edge mean the visible
            // bars cover the plot, plus at most one bar of rounding per side. The
            // plot is the canvas less the price gutter, not the canvas itself.
            const feedLayout = chart.options().layout;
            const feedPlotWidth = document.getElementById('chart').clientWidth - feedLayout.priceAxisWidth;
            const feedSpan = (feedRange.to - feedRange.from) * chart.getBarSpacing();
            if (feedSpan < feedPlotWidth || feedSpan >= feedPlotWidth + 2 * chart.getBarSpacing()) {
                throw new Error(
                    `Feed chart visible range spans ${feedSpan}px of a ${feedPlotWidth}px plot `
                    + `(canvas ${document.getElementById('chart').clientWidth}px less a `
                    + `${feedLayout.priceAxisWidth}px price gutter) at ${chart.getBarSpacing()}px per bar.`,
                );
            }

            // Candle bodies must actually reach the framebuffer of the main chart.
            const mainPixels = mainChartPixels();
            if (mainPixels.bodyPixels === 0) throw new Error('Candle bodies produced no filled pixels.');
            if (mainPixels.widestRun < 2) {
                throw new Error('Candle bodies did not cover at least two adjacent physical pixels.');
            }

            resultNode.textContent = JSON.stringify({
                result: 'PASS',
                retainedCandles: chart.getCandleCount(),
                anchorPreserved: true,
                sourceState: source.state,
                webglDrawCalls: window.__matrixChartsDrawCalls,
                dpr: window.devicePixelRatio,
                filledBodyPixels: mainPixels.bodyPixels,
                widestBodyPixelRun: mainPixels.widestRun,
                borderPixelRatios: borderPixelRatiosChecked,
                gutters: gutterReport,
                lineSeries: lineReport,
                volumeHistogram: volumeReport,
                candleStyles: styleReport,
                barSpacing: chart.getBarSpacing(),
                visibleLogicalRange: feedRange,
                visibleTimeRange: {
                    from: new Date(feedTimeRange.from).toISOString(),
                    to: new Date(feedTimeRange.to).toISOString(),
                },
                lastCandleTime: new Date(chart.getLastCandle().time).toISOString(),
                events: {
                    crosshairMoves: moves.length,
                    clicks: clicks.length,
                    visibleRangeChanges: ranges.length,
                    handlersAfterDestroy: postDestroy.length,
                },
            }, null, 2);
            document.documentElement.dataset.testResult = 'pass';
        } catch (error) {
            resultNode.textContent = `FAIL\n${error instanceof Error ? error.stack : String(error)}`;
            document.documentElement.dataset.testResult = 'fail';
            throw error;
        } finally {
            controller.dispose();
        }
    </script>
</body>
</html>
