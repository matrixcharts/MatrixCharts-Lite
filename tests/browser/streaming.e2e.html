<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MatrixCharts Streaming E2E</title>
    <style>
        body { margin: 20px; background: #0d1117; color: #c9d1d9; font: 14px sans-serif; }
        #chart { width: 900px; height: 480px; background: #161b22; }
        #result { white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Streaming integration check</h1>
    <div id="chart"></div>
    <pre id="result">running</pre>
    <script type="module">
        import { Chart, ChartFeedController, WebSocketCandleSource } from '../../src/index.ts';
        import { resolveOptions } from '../../src/core/options.ts';

        window.requestAnimationFrame = (callback) => window.setTimeout(() => callback(performance.now()), 16);
        window.cancelAnimationFrame = (frameId) => window.clearTimeout(frameId);
        Object.defineProperty(document, 'visibilityState', { configurable: true, value: 'visible' });
        Object.defineProperty(window, 'devicePixelRatio', { configurable: true, value: 2 });

        class TestSocket extends EventTarget {
            readyState = 0;
            sent = [];
            open() {
                this.readyState = 1;
                this.dispatchEvent(new Event('open'));
            }
            send(value) {
                this.sent.push(JSON.parse(value));
            }
            sendJson(value) {
                this.dispatchEvent(new MessageEvent('message', { data: JSON.stringify(value) }));
            }
            close() {
                this.readyState = 3;
                this.dispatchEvent(new Event('close'));
            }
        }

        const resultNode = document.querySelector('#result');
        // HTMLElement path: the plan requires the element overload to work.
        const chart = new Chart(document.getElementById('chart'), { maxRetainedCandles: 1000 });
        const socket = new TestSocket();
        const source = new WebSocketCandleSource('ws://integration.test/feed', {
            webSocketFactory: () => socket,
            reconnectMinDelayMs: 1000,
            reconnectMaxDelayMs: 1000,
            heartbeatTimeoutMs: 10_000,
            watchdogIntervalMs: 500,
        });
        const errors = [];
        window.__matrixChartsDrawCalls = 0;
        // WebGL clears the drawing buffer after compositing, so pixels have to be
        // read synchronously inside the draw call. Results are recorded per
        // context: a single global would be last-writer-wins across the several
        // charts this page creates, including a deliberately zero-sized one.
        const measured = new WeakMap();
        const measure = (gl) => {
            const pixels = new Uint8Array(gl.drawingBufferWidth * gl.drawingBufferHeight * 4);
            gl.readPixels(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
            let bodyPixels = 0;
            let widestRun = 0;
            const rowStride = gl.drawingBufferWidth * 4;
            for (let row = 0; row < gl.drawingBufferHeight; row++) {
                let runLength = 0;
                for (let column = 0; column < gl.drawingBufferWidth; column++) {
                    const pixelIndex = row * rowStride + column * 4;
                    const red = pixels[pixelIndex];
                    const green = pixels[pixelIndex + 1];
                    const alpha = pixels[pixelIndex + 3];
                    if (alpha > 0) bodyPixels++;
                    const isCandleColor = alpha > 0 && (green > red * 1.4 || red > green * 1.7);
                    runLength = isCandleColor ? runLength + 1 : 0;
                    widestRun = Math.max(widestRun, runLength);
                }
            }
            measured.set(gl, { bodyPixels, widestRun });
        };
        const mainChartPixels = () => {
            const canvas = document.querySelectorAll('#chart canvas')[1];
            return measured.get(canvas.getContext('webgl2')) ?? { bodyPixels: 0, widestRun: 0 };
        };
        const originalDrawArrays = WebGL2RenderingContext.prototype.drawArrays;
        WebGL2RenderingContext.prototype.drawArrays = function (...args) {
            window.__matrixChartsDrawCalls++;
            return originalDrawArrays.apply(this, args);
        };
        const originalDrawElements = WebGL2RenderingContext.prototype.drawElements;
        WebGL2RenderingContext.prototype.drawElements = function (...args) {
            window.__matrixChartsDrawCalls++;
            const result = originalDrawElements.apply(this, args);
            measure(this);
            return result;
        };
        const controller = new ChartFeedController(chart, source, () => {}, (error) => errors.push(String(error)));
        const baseTime = Date.UTC(2025, 0, 1);
        const makeCandle = (index, close = 100 + (index % 17)) => ({
            time: baseTime + index * 60_000,
            open: close - 0.4,
            high: close + 1 + (index % 9) * 0.1,
            low: close - 1 - (index % 7) * 0.1,
            close,
        });
        const waitFrame = () => new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        const eventCandlesForTeardown = (base) => Array.from({ length: 5 }, (_, index) => ({
            time: base + index * 60_000, open: 100, high: 101, low: 99, close: 100.5,
        }));
        /**
         * Finds a renderer by its layer's z-index rather than its position in the
         * renderers array, which is an implementation detail and is not paint order.
         */
        const layerRenderer = (chart, zIndex) => {
            const renderer = chart.renderers.find((candidate) => candidate.canvas.style.zIndex === String(zIndex));
            if (!renderer) throw new Error(`No renderer for layer z-index ${zIndex}.`);
            return renderer;
        };

        try {
            socket.open();
            if (socket.sent[0]?.type !== 'subscribe') throw new Error('Subscription frame was not sent.');

            const invalidOversizedInput = Array.from({ length: 1002 }, (_, index) => makeCandle(index + 2));
            invalidOversizedInput[0] = makeCandle(1);
            invalidOversizedInput[1] = makeCandle(0);
            let invalidInputRejected = false;
            try {
                chart.setData(invalidOversizedInput);
            } catch {
                invalidInputRejected = true;
            }
            if (!invalidInputRejected || chart.getCandleCount() !== 0) {
                throw new Error('setData accepted invalid ordering in history discarded by retention.');
            }

            const initial = Array.from({ length: 100 }, (_, index) => makeCandle(index));
            socket.sendJson({ type: 'snapshot', sequence: 500, candles: initial });
            if (chart.getCandleCount() !== 100) throw new Error('Initial snapshot was not loaded.');

            const appendBatch = Array.from({ length: 1200 }, (_, index) => makeCandle(index + 100));
            socket.sendJson({ type: 'append', sequence: 501, candles: appendBatch });
            await waitFrame();
            if (chart.getCandleCount() !== 1000) throw new Error('Retention did not cap history at 1,000 candles.');
            if (chart.getCandleAt(0).time !== makeCandle(300).time) throw new Error('Retention timestamp mapping is incorrect.');
            const aggregateRoot = chart.candlePyramid.getLevelData(chart.candlePyramid.levelCount - 1);
            if (aggregateRoot[2] < 100 || aggregateRoot[3] > 100) throw new Error('OHLC extrema were lost during retention.');

            // Forcing a specific viewport needs a private write; every read of the
            // same state below goes through the public API.
            chart.followsLiveEdge = false;
            chart.scaleX = 1.5;
            chart.offsetX = 450 - 450 * chart.getBarSpacing();
            const anchorIndex = Math.round((450 - chart.offsetX) / chart.getBarSpacing());
            const anchorTime = chart.getCandleAt(anchorIndex).time;

            socket.sendJson({ type: 'append', sequence: 503, candles: [makeCandle(1300)] });
            if (controller.state !== 'resyncing') throw new Error('Sequence gap did not enter resyncing state.');
            socket.sendJson({ type: 'append', sequence: 504, candles: [makeCandle(1301)] });
            await waitFrame();
            if (chart.getLastCandle().time === makeCandle(1301).time) throw new Error('Delta was applied before recovery snapshot.');

            const snapshot = Array.from({ length: 1000 }, (_, index) => makeCandle(index + 300));
            socket.sendJson({ type: 'snapshot', sequence: 900, candles: snapshot });
            const restoredAnchorIndex = Math.round((450 - chart.offsetX) / chart.getBarSpacing());
            if (chart.getCandleAt(restoredAnchorIndex).time !== anchorTime) {
                throw new Error('Historical timestamp anchor moved during snapshot replacement.');
            }
            socket.sendJson({ type: 'append', sequence: 901, candles: [makeCandle(1300)] });
            await waitFrame();
            if (chart.getLastCandle().time !== makeCandle(1300).time) throw new Error('Post-recovery append was not applied.');
            if (source.state !== 'connected') throw new Error('Source did not return to connected after snapshot.');
            if (document.querySelectorAll('#chart canvas').length !== 3) throw new Error('Chart layers were not mounted.');

            const gl = document.querySelectorAll('#chart canvas')[1].getContext('webgl2');
            if (!gl) throw new Error('WebGL context missing.');
            const glError = gl.getError();
            if (glError !== gl.NO_ERROR) throw new Error(`WebGL renderer reported error 0x${glError.toString(16)} (${glError}).`);
            if (window.__matrixChartsDrawCalls === 0) throw new Error('Candlestick renderer issued no draw calls.');
            const dataCanvas = document.querySelectorAll('#chart canvas')[1];
            if (dataCanvas.width !== Math.round(dataCanvas.clientWidth * window.devicePixelRatio)) {
                throw new Error('WebGL canvas backing resolution does not match DPR.');
            }

            const gapHost = document.createElement('div');
            gapHost.id = 'closed-session-time-check';
            gapHost.style.cssText = 'position:fixed;left:20px;top:20px;width:400px;height:240px';
            document.body.appendChild(gapHost);
            // String id path must keep working alongside the element overload.
            const gapChart = new Chart(gapHost.id);
            const friday = Date.UTC(2025, 0, 3, 20);
            const monday = Date.UTC(2025, 0, 6, 14, 30);
            const tuesday = Date.UTC(2025, 0, 7, 14, 30);
            const sessionCandle = (time, price) => ({ time, open: price, high: price + 1, low: price - 1, close: price + 0.5 });
            gapChart.setData([
                sessionCandle(friday, 100),
                sessionCandle(monday, 101),
                sessionCandle(tuesday, 102),
            ]);
            const timeRenderer = layerRenderer(gapChart, 0);
            const fridayLabel = timeRenderer.formatTimeAtIndex(0.4);
            const mondayLabel = timeRenderer.formatTimeAtIndex(0.6);
            // timeZone defaults to UTC so labels do not depend on the viewer's zone.
            const axisDateFormat = new Intl.DateTimeFormat(undefined, { month: 'short', day: '2-digit', timeZone: 'UTC' });
            if (fridayLabel !== axisDateFormat.format(new Date(friday))) {
                throw new Error(`Time axis interpolated a closed-session timestamp before Monday: got ${fridayLabel}.`);
            }
            if (mondayLabel !== axisDateFormat.format(new Date(monday))) {
                throw new Error('Time axis did not snap to the real Monday candle timestamp.');
            }
            // The timeZone option must actually change the rendered label.
            const easternLabel = (() => {
                gapChart.applyOptions({ timeZone: 'America/New_York' });
                return timeRenderer.formatTimeAtIndex(0.4);
            })();
            gapChart.applyOptions({ timeZone: 'UTC' });
            if (timeRenderer.formatTimeAtIndex(0.4) !== fridayLabel) {
                throw new Error('Restoring timeZone to UTC did not restore the label.');
            }
            // Friday 20:00 UTC is 15:00 in New York, so the day must agree but the
            // formatter must have been rebuilt. Assert the option took effect by
            // checking a zone far enough from UTC to shift the calendar day.
            gapChart.applyOptions({ timeZone: 'Asia/Tokyo' });
            const tokyoLabel = timeRenderer.formatTimeAtIndex(0.4);
            gapChart.applyOptions({ timeZone: 'UTC' });
            if (tokyoLabel === fridayLabel) {
                throw new Error('Changing timeZone did not change the time axis label.');
            }
            void easternLabel;

            // --- Public read API -------------------------------------------------
            // Everything below uses only documented public methods.
            const assertClose = (actual, expected, message) => {
                if (!(Math.abs(actual - expected) < 1e-6)) {
                    throw new Error(`${message}: expected ${actual} to be within 1e-6 of ${expected}`);
                }
            };
            const assertEqual = (actual, expected, message) => {
                if (actual !== expected) throw new Error(`${message}: expected ${actual} to equal ${expected}`);
            };

            assertEqual(gapChart.getCandleCount(), 3, 'getCandleCount');
            assertEqual(gapChart.getBarSpacing() > 0, true, 'getBarSpacing is positive');

            const lastGapCandle = gapChart.getLastCandle();
            assertEqual(lastGapCandle.time, tuesday, 'getLastCandle time');
            assertClose(lastGapCandle.open, 102, 'getLastCandle open');
            assertClose(lastGapCandle.close, 102.5, 'getLastCandle close');
            assertEqual(gapChart.getCandleAt(2).time, lastGapCandle.time, 'getCandleAt matches getLastCandle');
            assertEqual(gapChart.getCandleAt(-1), null, 'getCandleAt rejects a negative index');
            assertEqual(gapChart.getCandleAt(3), null, 'getCandleAt rejects an index past the end');
            assertEqual(gapChart.getCandleAt(1.5), null, 'getCandleAt rejects a fractional index');

            // index <-> coordinate round trip at the real dpr of 2.
            for (const index of [0, 1, 2]) {
                assertClose(
                    gapChart.coordinateToIndex(gapChart.indexToCoordinate(index)),
                    index,
                    `index ${index} round trip`,
                );
            }
            assertEqual(gapChart.coordinateToNearestIndex(gapChart.indexToCoordinate(1)), 1, 'nearest index');
            assertEqual(gapChart.coordinateToNearestIndex(-9999), 0, 'nearest index clamps left');
            assertEqual(gapChart.coordinateToNearestIndex(9999), 2, 'nearest index clamps right');

            // The x halfway between two bars sits in the gap between their
            // timestamps. Each conversion must snap to one of the two real candle
            // times, never to an interpolated instant in between. The first pair
            // straddles a weekend.
            const midpointIsOneOf = (leftIndex, rightIndex, leftTime, rightTime) => {
                const midX = (gapChart.indexToCoordinate(leftIndex) + gapChart.indexToCoordinate(rightIndex)) / 2;
                const midTime = gapChart.coordinateToTime(midX);
                if (midTime !== leftTime && midTime !== rightTime) {
                    throw new Error(
                        `coordinateToTime interpolated between bars ${leftIndex} and ${rightIndex}: `
                        + `${new Date(midTime).toISOString()}`,
                    );
                }
                return midTime;
            };
            const weekendMid = midpointIsOneOf(0, 1, friday, monday);
            midpointIsOneOf(1, 2, monday, tuesday);
            // The weekend midpoint is far nearer Monday in wall-clock terms, so it
            // must resolve to a real bar rather than a Saturday timestamp.
            if (weekendMid !== monday && weekendMid !== friday) {
                throw new Error('Weekend midpoint produced a synthetic timestamp.');
            }
            for (const [index, expectedTime] of [[0, friday], [1, monday], [2, tuesday]]) {
                assertEqual(gapChart.indexToCoordinate(index), gapChart.timeToCoordinate(expectedTime), `timeToCoordinate at ${index}`);
                assertEqual(gapChart.coordinateToTime(gapChart.indexToCoordinate(index)), expectedTime, `coordinateToTime at ${index}`);
            }
            // A time before the series clamps to the oldest bar, after to the newest.
            assertEqual(gapChart.coordinateToTime(gapChart.timeToCoordinate(0)), friday, 'timeToCoordinate clamps low');
            assertEqual(gapChart.coordinateToTime(gapChart.timeToCoordinate(9_999_999_999_999)), tuesday, 'timeToCoordinate clamps high');

            // price <-> coordinate round trip.
            const price = gapChart.coordinateToPrice(120);
            assertClose(gapChart.priceToCoordinate(price), 120, 'price round trip');
            assertClose(gapChart.priceToCoordinate(100), gapChart.priceToCoordinate(100), 'priceToCoordinate is stable');

            // The three bars are the whole visible window at the live edge.
            const gapRange = gapChart.getVisibleLogicalRange();
            assertEqual(gapRange.to, 3, 'visible logical range includes the newest bar at the live edge');
            assertEqual(gapRange.from, 0, 'visible logical range starts at the oldest bar');
            const gapTimeRange = gapChart.getVisibleTimeRange();
            assertEqual(gapTimeRange.from, friday, 'visible time range starts at the first bar');
            assertEqual(gapTimeRange.to, tuesday, 'visible time range ends at the last bar');
            assertEqual(
                `${gapTimeRange.from}/${gapTimeRange.to}`,
                `${gapChart.getCandleAt(gapRange.from).time}/${gapChart.getCandleAt(gapRange.to - 1).time}`,
                'visible time range agrees with the logical range',
            );

            gapChart.setData([]);
            assertEqual(gapChart.getCandleCount(), 0, 'count after clearing');
            assertEqual(gapChart.getLastCandle(), null, 'getLastCandle on an empty chart');
            assertEqual(gapChart.getCandleAt(0), null, 'getCandleAt on an empty chart');
            assertEqual(gapChart.coordinateToTime(10), null, 'coordinateToTime on an empty chart');
            assertEqual(gapChart.timeToCoordinate(friday), null, 'timeToCoordinate on an empty chart');
            assertEqual(gapChart.coordinateToNearestIndex(10), -1, 'nearest index on an empty chart');
            assertEqual(gapChart.getVisibleTimeRange(), null, 'visible time range on an empty chart');
            const emptyRange = gapChart.getVisibleLogicalRange();
            assertEqual(emptyRange.from, 0, 'empty visible range from');
            assertEqual(emptyRange.to, 0, 'empty visible range to');

            gapChart.destroy();
            gapHost.remove();

            // A container that is not in the document yet must still mount and
            // accept data.
            // Backing-store sizing for a late-attached container is NOT asserted
            // here: it depends on a ResizeObserver delivery, and the headless
            // runner used for this page never delivers ResizeObserver
            // notifications, so the assertion would be testing the runner. The
            // already-sized path is covered above by the DPR check on #chart.
            const detachedHost = document.createElement('div');
            detachedHost.style.cssText = 'width:320px;height:200px';
            const detachedChart = new Chart(detachedHost);
            if (detachedHost.querySelectorAll('canvas').length !== 3) {
                throw new Error('Chart did not mount into a detached container.');
            }
            detachedChart.setData([sessionCandle(friday, 100), sessionCandle(monday, 101)]);
            assertEqual(detachedChart.getCandleCount(), 2, 'a detached container accepted data');
            document.body.appendChild(detachedHost);
            await waitFrame();
            detachedChart.destroy();
            if (detachedHost.childElementCount !== 0) {
                throw new Error('destroy() did not empty a container it did not create.');
            }
            detachedHost.remove();

            // Sizing must not depend solely on ResizeObserver. A container that
            // gains or changes its size while the chart is not rendering has to
            // correct itself the next time the chart renders, even in an
            // environment where observer notifications never arrive. A hover
            // deliberately does not count: it repaints only the UI layer, so it
            // must not resize canvases it is not about to redraw. A zoom is a
            // real render, so that is the trigger used here.
            const lateHost = document.createElement('div');
            lateHost.style.cssText = 'width:320px;height:200px';
            const lateChart = new Chart(lateHost);
            lateChart.setData([sessionCandle(friday, 100), sessionCandle(monday, 101)]);
            document.body.appendChild(lateHost);
            const lateSurface = lateHost.firstElementChild;
            const lateCanvas = lateHost.querySelectorAll('canvas')[1];
            if (lateCanvas.width > 300) {
                throw new Error('The chart should not have been sized while its container was detached.');
            }
            const zoom = () => {
                const rect = lateHost.getBoundingClientRect();
                lateSurface.dispatchEvent(new WheelEvent('wheel', {
                    deltaY: -100, clientX: rect.left + 160, clientY: rect.top + 100,
                    bubbles: true, cancelable: true,
                }));
            };
            zoom();
            await waitFrame();
            if (lateCanvas.width !== Math.round(lateCanvas.clientWidth * window.devicePixelRatio)) {
                throw new Error(
                    `The chart did not correct its canvas size on render: `
                    + `backing ${lateCanvas.width} for css ${lateCanvas.clientWidth}.`,
                );
            }
            if (lateCanvas.width <= 300) {
                throw new Error('The chart canvas is still at its unsized default.');
            }
            // A real container resize is picked up the same way.
            lateHost.style.width = '500px';
            zoom();
            await waitFrame();
            if (lateCanvas.width !== Math.round(lateCanvas.clientWidth * window.devicePixelRatio)) {
                throw new Error(
                    `The chart did not pick up a container resize: `
                    + `backing ${lateCanvas.width} for css ${lateCanvas.clientWidth}.`,
                );
            }
            if (lateCanvas.width <= Math.round(320 * window.devicePixelRatio)) {
                throw new Error('The canvas did not grow with its container.');
            }
            lateChart.destroy();
            lateHost.remove();

            // A handler that calls back into the chart must not be able to drive
            // an unbounded event loop.
            const reentryHost = document.createElement('div');
            reentryHost.style.cssText = 'width:400px;height:220px';
            document.body.appendChild(reentryHost);
            const reentryChart = new Chart(reentryHost);
            reentryChart.setData(Array.from({ length: 30 }, (_, index) => sessionCandle(baseTime + index * 60_000, 100 + index)));
            await waitFrame();
            const reentrySurface = reentryHost.firstElementChild;

            let rangeEvents = 0;
            reentryChart.subscribeVisibleRangeChange(() => {
                rangeEvents++;
                if (rangeEvents < 500) {
                    // Restyling from inside the handler is the pathological case.
                    reentryChart.applyOptions({ timeScale: { barSpacing: 8 + (rangeEvents % 5) } });
                }
            });
            let crosshairEvents = 0;
            reentryChart.subscribeCrosshairMove(() => {
                crosshairEvents++;
                if (crosshairEvents < 500) {
                    reentryChart.applyOptions({ crosshair: { visible: true } });
                }
            });

            const reentryRect = reentryHost.getBoundingClientRect();
            reentrySurface.dispatchEvent(new PointerEvent('pointermove', {
                clientX: reentryRect.left + 200, clientY: reentryRect.top + 110,
                bubbles: true, pointerId: 41, pointerType: 'mouse',
            }));
            for (let frame = 0; frame < 12; frame++) await waitFrame();
            if (rangeEvents > 20) {
                throw new Error(`A re-entrant range handler produced ${rangeEvents} events; the loop is not bounded.`);
            }
            if (crosshairEvents > 20) {
                throw new Error(`A re-entrant crosshair handler produced ${crosshairEvents} events; the loop is not bounded.`);
            }
            // The chart must still work normally afterwards.
            assertEqual(reentryChart.getCandleCount(), 30, 'the chart survived the re-entrant handlers');
            reentryChart.destroy();
            reentryHost.remove();

            // --- WebGL2 requirement --------------------------------------------
            // v1 has no Canvas2D fallback. An unsupported engine must fail fast with
            // a stable message and leave the caller's container untouched, rather
            // than a half-mounted shell of empty canvases.
            const requiredHost = document.createElement('div');
            requiredHost.id = 'webgl2-requirement-host';
            requiredHost.style.cssText = 'width:320px;height:200px';
            const callerMarkup = document.createElement('span');
            callerMarkup.id = 'caller-markup';
            callerMarkup.textContent = 'integrator markup';
            requiredHost.appendChild(callerMarkup);
            document.body.appendChild(requiredHost);

            const realGetContext = HTMLCanvasElement.prototype.getContext;
            HTMLCanvasElement.prototype.getContext = function patchedGetContext(type, ...rest) {
                if (type === 'webgl2') return null;
                return realGetContext.call(this, type, ...rest);
            };
            let requiredMessage = null;
            let requiredThrew = false;
            try {
                // eslint-disable-next-line no-new
                new Chart(requiredHost);
            } catch (error) {
                requiredThrew = true;
                requiredMessage = error instanceof Error ? error.message : String(error);
            } finally {
                HTMLCanvasElement.prototype.getContext = realGetContext;
            }

            if (!requiredThrew) throw new Error('A chart constructed without WebGL2 instead of throwing.');
            assertEqual(requiredMessage, 'MatrixCharts: WebGL2 is required.', 'stable WebGL2 error message');
            if (requiredHost.querySelectorAll('canvas').length !== 0) {
                throw new Error('A failed construction left canvases in the caller container.');
            }
            if (requiredHost.querySelectorAll('div').length !== 0) {
                throw new Error('A failed construction left a wrapper element in the caller container.');
            }
            if (!document.getElementById('caller-markup')) {
                throw new Error('A failed construction removed the caller own markup.');
            }

            // The failure must not poison anything: restoring WebGL2 has to work.
            const recoveredChart = new Chart(requiredHost);
            assertEqual(recoveredChart.getCandleCount(), 0, 'recovered chart mounted');
            if (requiredHost.querySelectorAll('canvas').length !== 3) {
                throw new Error('The recovered chart did not mount its three layers.');
            }
            assertEqual(document.getElementById('caller-markup') !== null, true, 'caller markup survived recovery');
            recoveredChart.destroy();
            if (requiredHost.querySelectorAll('canvas').length !== 0) {
                throw new Error('destroy() left layers behind after recovery.');
            }
            requiredHost.remove();

            // --- Teardown contract -----------------------------------------------
            // destroy() removes only what the chart created, and leaves the object
            // uniformly unusable rather than half-working.
            const teardownHost = document.createElement('div');
            teardownHost.style.cssText = 'width:320px;height:200px';
            const teardownSibling = document.createElement('span');
            teardownSibling.id = 'teardown-sibling';
            teardownSibling.textContent = 'caller markup';
            teardownHost.appendChild(teardownSibling);
            document.body.appendChild(teardownHost);

            const teardownChart = new Chart(teardownHost);
            teardownChart.setData(eventCandlesForTeardown(baseTime));
            await waitFrame();
            if (teardownHost.querySelectorAll('canvas').length !== 3) {
                throw new Error('Teardown chart did not mount its layers.');
            }
            teardownChart.destroy();
            if (teardownHost.querySelectorAll('canvas').length !== 0) {
                throw new Error('destroy() left the chart layers in the container.');
            }
            if (!document.getElementById('teardown-sibling')) {
                throw new Error('destroy() removed markup the caller put in the container.');
            }
            assertEqual(teardownHost.children.length, 1, 'only the caller markup remains after destroy');

            // Every public entry point must report the same single error.
            const destroyedCalls = [
                ['setData', () => teardownChart.setData([])],
                ['replaceData', () => teardownChart.replaceData([])],
                ['appendData', () => teardownChart.appendData({ time: baseTime, open: 1, high: 1, low: 1, close: 1 })],
                ['appendBatch', () => teardownChart.appendBatch([])],
                ['updateLast', () => teardownChart.updateLast({ time: baseTime, open: 1, high: 1, low: 1, close: 1 })],
                ['setTheme', () => teardownChart.setTheme('paper')],
                ['applyOptions', () => teardownChart.applyOptions({ theme: 'paper' })],
                ['options', () => teardownChart.options()],
                ['getBarSpacing', () => teardownChart.getBarSpacing()],
                ['getVisibleLogicalRange', () => teardownChart.getVisibleLogicalRange()],
                ['getVisibleTimeRange', () => teardownChart.getVisibleTimeRange()],
                ['getCandleCount', () => teardownChart.getCandleCount()],
                ['getCandleAt', () => teardownChart.getCandleAt(0)],
                ['getLastCandle', () => teardownChart.getLastCandle()],
                ['indexToCoordinate', () => teardownChart.indexToCoordinate(0)],
                ['coordinateToIndex', () => teardownChart.coordinateToIndex(0)],
                ['coordinateToNearestIndex', () => teardownChart.coordinateToNearestIndex(0)],
                ['coordinateToTime', () => teardownChart.coordinateToTime(0)],
                ['timeToCoordinate', () => teardownChart.timeToCoordinate(baseTime)],
                ['priceToCoordinate', () => teardownChart.priceToCoordinate(1)],
                ['coordinateToPrice', () => teardownChart.coordinateToPrice(1)],
                ['subscribeCrosshairMove', () => teardownChart.subscribeCrosshairMove(() => {})],
                ['subscribeClick', () => teardownChart.subscribeClick(() => {})],
                ['subscribeVisibleRangeChange', () => teardownChart.subscribeVisibleRangeChange(() => {})],
            ];
            for (const [label, call] of destroyedCalls) {
                let message = null;
                try {
                    call();
                } catch (error) {
                    message = error instanceof Error ? error.message : String(error);
                }
                if (message !== 'MatrixCharts: This chart has been destroyed.') {
                    throw new Error(`${label}() after destroy reported ${JSON.stringify(message)}.`);
                }
            }
            // destroy() stays idempotent.
            teardownChart.destroy();
            teardownHost.remove();

            // --- applyOptions ---------------------------------------------------
            // Recolouring must reach the GPU without a setData, which is the
            // point of runtime options.
            const optionsHost = document.createElement('div');
            optionsHost.style.cssText = 'position:fixed;left:20px;top:20px;width:600px;height:300px';
            document.body.appendChild(optionsHost);
            const optionsChart = new Chart(optionsHost);
            const optionsCandles = Array.from({ length: 40 }, (_, index) => ({
                time: baseTime + index * 60_000,
                open: 100 + index,
                high: 101 + index,
                low: 99 + index,
                close: 100.4 + index,
            }));
            const optionsSurface = optionsHost.firstElementChild;
            const optionsCanvas = optionsHost.querySelectorAll('canvas')[1];
            const optionsGl = optionsCanvas.getContext('webgl2');

            /**
             * Colour census of the options chart, sampled synchronously inside
             * drawElements. WebGL clears the drawing buffer once the frame is
             * composited, and the chart only redraws when something asks it to, so
             * a measurement has to both force a repaint and read during the draw.
             */
            let census = { magenta: 0, green: 0 };
            const optionsDrawElements = optionsGl.drawElements.bind(optionsGl);
            optionsGl.drawElements = (...args) => {
                const result = optionsDrawElements(...args);
                const pixels = new Uint8Array(optionsGl.drawingBufferWidth * optionsGl.drawingBufferHeight * 4);
                optionsGl.readPixels(0, 0, optionsGl.drawingBufferWidth, optionsGl.drawingBufferHeight, optionsGl.RGBA, optionsGl.UNSIGNED_BYTE, pixels);
                let magenta = 0;
                let green = 0;
                for (let i = 0; i < pixels.length; i += 4) {
                    const r = pixels[i];
                    const g = pixels[i + 1];
                    const b = pixels[i + 2];
                    const a = pixels[i + 3];
                    if (a < 128) continue;
                    if (r > 200 && b > 200 && g < 80) magenta++;
                    if (g > 150 && r < 100 && b < 160) green++;
                }
                census = { magenta, green };
                return result;
            };
            /** Repaints via a no-op option change, then returns the sampled census. */
            const recoloured = async () => {
                census = { magenta: 0, green: 0 };
                optionsChart.applyOptions({ crosshair: { visible: true } });
                await waitFrame();
                return census;
            };

            optionsChart.setData(optionsCandles);
            await waitFrame();
            const before = await recoloured();
            if (before.magenta !== 0) throw new Error('Unexpected magenta before recolouring.');
            if (before.green === 0) throw new Error('No green up bodies before recolouring.');

            const candlesBefore = optionsChart.getCandleCount();
            optionsChart.applyOptions({ candlestick: { upColor: '#ff00ff' } });
            if (optionsChart.getCandleCount() !== candlesBefore) {
                throw new Error('applyOptions changed the data series.');
            }
            const afterUp = await recoloured();
            if (afterUp.magenta === 0) {
                throw new Error('applyOptions did not recolour the candle bodies on the GPU.');
            }
            if (afterUp.green !== 0) {
                throw new Error('The old up colour is still on screen after recolouring.');
            }
            assertEqual(optionsChart.options().candlestick.upColor, '#ff00ff', 'resolved up colour');

            // An explicit override survives a theme change.
            optionsChart.applyOptions({ theme: 'paper' });
            await waitFrame();
            assertEqual(optionsChart.options().theme, 'paper', 'theme applied');
            assertEqual(optionsChart.options().candlestick.upColor, '#ff00ff', 'override survived the theme change');
            assertEqual(
                optionsChart.options().candlestick.downColor,
                resolveOptions({ theme: 'paper' }).candlestick.downColor,
                'untouched colour came from the new preset',
            );
            optionsChart.applyOptions({ theme: 'dark' });
            optionsChart.applyOptions({ candlestick: { upColor: '#1ad98c' } });
            const afterRestore = await recoloured();
            if (afterRestore.green === 0) throw new Error('Restoring the original up colour did not repaint.');

            // Invalid values throw and leave the chart untouched.
            const snapshotBeforeBadApply = JSON.stringify(optionsChart.options());
            for (const bad of [
                { candlestick: { upColor: 'chartreuse' } },
                { priceFormat: { precision: 99 } },
                { timeScale: { minBarSpacing: 100, maxBarSpacing: 1 } },
                { locale: 'not a locale' },
                { timeZone: 'Mars/Olympus' },
                { maxRetainedCandles: 10 },
            ]) {
                let threw = false;
                try {
                    optionsChart.applyOptions(bad);
                } catch (error) {
                    threw = String(error.message).startsWith('MatrixCharts:');
                }
                if (!threw) throw new Error(`applyOptions accepted ${JSON.stringify(bad)}.`);
            }
            if (JSON.stringify(optionsChart.options()) !== snapshotBeforeBadApply) {
                throw new Error('A rejected applyOptions mutated the resolved options.');
            }

            // Zoom clamps to the configured bounds.
            optionsChart.applyOptions({ timeScale: { barSpacing: 20, minBarSpacing: 5, maxBarSpacing: 40 } });
            assertEqual(optionsChart.getBarSpacing(), 20, 'barSpacing applied');
            for (let i = 0; i < 40; i++) {
                optionsSurface.dispatchEvent(new WheelEvent('wheel', {
                    deltaY: -100, clientX: 300, clientY: 150, bubbles: true, cancelable: true,
                }));
            }
            await waitFrame();
            assertEqual(optionsChart.getBarSpacing(), 40, 'zoom clamped to maxBarSpacing');
            for (let i = 0; i < 80; i++) {
                optionsSurface.dispatchEvent(new WheelEvent('wheel', {
                    deltaY: 100, clientX: 300, clientY: 150, bubbles: true, cancelable: true,
                }));
            }
            await waitFrame();
            assertEqual(optionsChart.getBarSpacing(), 5, 'zoom clamped to minBarSpacing');
            optionsChart.applyOptions({ timeScale: { barSpacing: 14, minBarSpacing: 0.5, maxBarSpacing: 400 } });
            assertEqual(optionsChart.getBarSpacing(), 14, 'barSpacing reset');

            // Price precision reaches the axis labels. precision and minMove must
            // be set together, because a precision of 0 cannot show a 0.01 tick.
            const labelFor = (precision) => {
                const minMove = Math.pow(10, -precision);
                optionsChart.applyOptions({ priceFormat: { precision, minMove } });
                return layerRenderer(optionsChart, 0).formatAxisValue(1234.5678);
            };
            assertEqual(labelFor(0), new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 }).format(1234.5678), 'precision 0');
            assertEqual(labelFor(2), new Intl.NumberFormat(undefined, { maximumFractionDigits: 2 }).format(1234.5678), 'precision 2');
            assertEqual(labelFor(4), new Intl.NumberFormat(undefined, { maximumFractionDigits: 4 }).format(1234.5678), 'precision 4');

            // Lowering precision without widening minMove is rejected.
            let precisionRejected = false;
            try {
                optionsChart.applyOptions({ priceFormat: { precision: 0 } });
            } catch (error) {
                precisionRejected = String(error.message).includes('finer than');
            }
            if (!precisionRejected) throw new Error('A precision/minMove mismatch was accepted.');
            optionsChart.applyOptions({ priceFormat: { precision: 2, minMove: 0.01 } });

            // The locale changes label formatting.
            const localeLabel = (locale) => {
                optionsChart.applyOptions({ locale });
                return layerRenderer(optionsChart, 0).formatAxisValue(1234.5);
            };
            assertEqual(localeLabel('en-US'), '1,234.5', 'en-US label');
            assertEqual(localeLabel('de-DE'), new Intl.NumberFormat('de-DE', { maximumFractionDigits: 2 }).format(1234.5), 'de-DE label');
            optionsChart.applyOptions({ locale: 'en-US' });

            // Crosshair visibility and grid toggles are honoured by the renderers.
            const uiPixels = () => {
                const canvas = optionsHost.querySelectorAll('canvas')[2];
                const ctx = canvas.getContext('2d');
                const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                let n = 0;
                for (let i = 3; i < data.length; i += 4) if (data[i] > 0) n++;
                return n;
            };
            optionsSurface.dispatchEvent(new PointerEvent('pointermove', {
                clientX: optionsHost.getBoundingClientRect().left + 400,
                clientY: optionsHost.getBoundingClientRect().top + 150,
                bubbles: true, pointerId: 21, pointerType: 'mouse',
            }));
            await waitFrame();
            if (uiPixels() === 0) throw new Error('No crosshair was drawn before hiding it.');
            optionsChart.applyOptions({ crosshair: { visible: false } });
            await waitFrame();
            if (uiPixels() !== 0) throw new Error('crosshair.visible=false still drew the crosshair.');
            optionsChart.applyOptions({ crosshair: { visible: true } });
            await waitFrame();
            if (uiPixels() === 0) throw new Error('crosshair.visible=true did not restore the crosshair.');

            // Wick and border flags are accepted and round-trip through options().
            optionsChart.applyOptions({ candlestick: { wickVisible: false } });
            assertEqual(optionsChart.options().candlestick.wickVisible, false, 'wickVisible false');
            optionsChart.applyOptions({ candlestick: { wickVisible: true, borderVisible: true, borderUpColor: '#ff00ff' } });
            assertEqual(optionsChart.options().candlestick.borderVisible, true, 'borderVisible true');
            const bordered = await recoloured();
            if (bordered.green === 0) throw new Error('Bordered bodies drew no up colour.');
            if (bordered.magenta === 0) throw new Error('borderVisible drew no border pixels.');
            if (optionsGl.getError() !== optionsGl.NO_ERROR) {
                throw new Error('The bordered body path reported a GL error.');
            }
            // Turning the border off must restore the original pixel counts.
            optionsChart.applyOptions({ candlestick: { borderVisible: false, borderUpColor: '#1ad98c' } });
            const plainAgain = await recoloured();
            if (plainAgain.magenta !== 0) throw new Error('Border pixels survived borderVisible=false.');
            if (plainAgain.green === 0) throw new Error('Repainting after the border toggle lost the up colour.');

            // --- Border geometry and translucency -----------------------------
            // A border is a frame, never a fill under the body: a translucent fill
            // must keep compositing against the background, not the border colour.
            // Measured on one large opaque-bodied candle so the numbers are exact.
            const frameHost = document.createElement('div');
            frameHost.style.cssText = 'width:200px;height:160px';
            document.body.appendChild(frameHost);
            const frameChart = new Chart(frameHost, {
                theme: 'paper',
                candlestick: { upColor: '#00ff00', borderUpColor: '#ff0000', wickVisible: false, borderVisible: true },
            });
            const frameCandle = [{ time: baseTime, open: 100, high: 102, low: 98, close: 101 }];
            frameChart.setData(frameCandle);
            const frameCanvas = frameHost.querySelectorAll('canvas')[1];
            const frameGl = frameCanvas.getContext('webgl2');
            let frame = null;
            const frameDraw = frameGl.drawElements.bind(frameGl);
            frameGl.drawElements = (...args) => {
                const result = frameDraw(...args);
                const W = frameGl.drawingBufferWidth;
                const H = frameGl.drawingBufferHeight;
                const px = new Uint8Array(W * H * 4);
                frameGl.readPixels(0, 0, W, H, frameGl.RGBA, frameGl.UNSIGNED_BYTE, px);
                const at = (x, y) => {
                    const i = (y * W + x) * 4;
                    return { r: px[i], g: px[i + 1], b: px[i + 2], a: px[i + 3] };
                };
                const isRed = (c) => c.r > 200 && c.g < 60 && c.b < 60;
                const isGreen = (c) => c.g > 200 && c.r < 60 && c.b < 60;
                const isAlphaGreen = (c) => c.a > 16 && c.a < 200 && c.g > 90 && c.g < 190 && c.r < 60 && c.b < 60;
                let minX = Infinity, maxX = -1, minY = Infinity, maxY = -1;
                for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
                    if (at(x, y).a < 16) continue;
                    if (x < minX) minX = x; if (x > maxX) maxX = x;
                    if (y < minY) minY = y; if (y > maxY) maxY = y;
                }
                if (maxX >= 0) {
                    let red = 0, green = 0, alphaGreen = 0;
                    for (let y = minY; y <= maxY; y++) for (let x = minX; x <= maxX; x++) {
                        const c = at(x, y);
                        if (c.a < 16) continue;
                        if (isRed(c)) red++;
                        else if (isGreen(c)) green++;
                        else if (isAlphaGreen(c)) alphaGreen++;
                    }
                    const cx = Math.floor((minX + maxX) / 2);
                    const cy = Math.floor((minY + maxY) / 2);
                    frame = {
                        w: maxX - minX + 1,
                        h: maxY - minY + 1,
                        red, green, alphaGreen,
                        centre: at(cx, cy),
                        topRowAllRed: (() => {
                            for (let x = minX; x <= maxX; x++) if (!isRed(at(x, minY))) return false;
                            return true;
                        })(),
                    };
                }
                return result;
            };
            const sampleFrame = async (apply) => {
                frame = null;
                apply();
                await waitFrame();
                return frame;
            };

            const opaqueFrame = await sampleFrame(() => frameChart.applyOptions({ crosshair: { visible: true } }));
            if (!opaqueFrame) throw new Error('The bordered candle produced no pixels to measure.');
            if (opaqueFrame.red === 0) throw new Error('The border frame drew no pixels.');
            if (!opaqueFrame.topRowAllRed) throw new Error('The border frame is not continuous along the top edge.');
            if (opaqueFrame.green === 0) throw new Error('The bordered body drew no fill.');
            // A 1px frame on a w x h rect covers exactly its perimeter, so the
            // border must be a small fraction of the body rather than covering it.
            const perimeter = 2 * (opaqueFrame.w + opaqueFrame.h) - 4;
            if (opaqueFrame.red !== perimeter) {
                throw new Error(`Border covers ${opaqueFrame.red}px, expected the ${perimeter}px perimeter of a ${opaqueFrame.w}x${opaqueFrame.h} frame.`);
            }

            // The regression: with a translucent fill the interior must stay
            // translucent and must not pick up the border colour.
            const alphaFrame = await sampleFrame(() => frameChart.applyOptions({
                candlestick: { upColor: 'rgba(0,255,0,0.5)' },
            }));
            if (!alphaFrame) throw new Error('The translucent bordered candle produced no pixels.');
            if (alphaFrame.red !== perimeter) {
                throw new Error(`Translucent border perimeter changed: ${alphaFrame.red}px vs ${perimeter}px.`);
            }
            if (alphaFrame.alphaGreen === 0) {
                throw new Error('The translucent fill did not composite against the background.');
            }
            if (isBorderTint(alphaFrame.centre)) {
                throw new Error(
                    `The border bled through the translucent fill: centre is `
                    + `rgb(${alphaFrame.centre.r},${alphaFrame.centre.g},${alphaFrame.centre.b}).`,
                );
            }

            function isBorderTint(c) {
                // Red showing through green at partial alpha lands in this range.
                return c.r > 90 && c.r < 190 && c.g > 90 && c.g < 190 && c.b < 90;
            }

            frameChart.destroy();
            frameHost.remove();

            let borderPixelRatiosChecked = 0;

            // --- Second series on the same layer ---------------------------
            let lineReport = null;
            // Each series owns its buffers, so uploading a line must leave the
            // candles intact. The line also goes through the same device-pixel
            // transform, so at a pixel ratio above one it must land in the middle
            // of the plot. The retired CSS-pixel line program placed geometry in
            // the top-left quarter of the canvas instead, which this pins.
            {
                const dataRenderer = layerRenderer(chart, 1);
                if (typeof dataRenderer.drawLine !== 'function') {
                    throw new Error('The data renderer exposes no line series.');
                }
                const gl = dataRenderer.gl;
                const dataCanvas = dataRenderer.canvas;

                // Captured on every draw call, so the last capture of a frame is
                // the whole composited frame: the line series draws after the
                // candles, so its pixels are on top and both are present.
                let frame = null;
                const readFrame = () => {
                    const w = gl.drawingBufferWidth;
                    const h = gl.drawingBufferHeight;
                    const px = new Uint8Array(w * h * 4);
                    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
                    frame = { w, h, px };
                };
                const originalArrays = gl.drawArrays.bind(gl);
                const originalElements = gl.drawElements.bind(gl);
                gl.drawArrays = (...a) => { const o = originalArrays(...a); readFrame(); return o; };
                gl.drawElements = (...a) => { const o = originalElements(...a); readFrame(); return o; };

                const countOpaque = (snapshot) => {
                    let n = 0;
                    for (let i = 3; i < snapshot.px.length; i += 4) if (snapshot.px[i] > 16) n++;
                    return n;
                };

                chart.applyOptions({ crosshair: { visible: true } });
                await waitFrame();
                if (!frame) {
                    gl.drawArrays = originalArrays;
                    gl.drawElements = originalElements;
                    throw new Error('No data-layer frame captured before adding a second series.');
                }
                const before = { ...frame, opaque: countOpaque(frame) };

                // A flat line at the newest candle's midpoint, across the middle
                // third of the visible range.
                const visible = chart.getVisibleLogicalRange();
                const newest = chart.getLastCandle();
                const midPrice = (newest.open + newest.close) / 2;
                const from = visible.from + (visible.to - visible.from) / 3;
                const to = visible.from + ((visible.to - visible.from) * 2) / 3;
                const points = new Float32Array(64);
                for (let i = 0; i < 32; i++) {
                    points[i * 2] = from + ((to - from) * i) / 31;
                    points[i * 2 + 1] = midPrice;
                }
                dataRenderer.drawLine(points, [0, 0, 255, 1]);

                chart.applyOptions({ crosshair: { visible: true } });
                await waitFrame();
                gl.drawArrays = originalArrays;
                gl.drawElements = originalElements;
                if (!frame) throw new Error('No data-layer frame captured after adding a second series.');

                // Pure blue, unlike any theme colour, so the line is unambiguous.
                let linePixels = 0, lineMinX = Infinity, lineMaxX = -1, lineYSum = 0;
                for (let y = 0; y < frame.h; y++) {
                    for (let x = 0; x < frame.w; x++) {
                        const i = (y * frame.w + x) * 4;
                        if (frame.px[i + 3] <= 16) continue;
                        if (frame.px[i + 2] > 200 && frame.px[i] < 80 && frame.px[i + 1] < 80) {
                            linePixels++;
                            lineYSum += y;
                            if (x < lineMinX) lineMinX = x;
                            if (x > lineMaxX) lineMaxX = x;
                        }
                    }
                }
                // The total opaque count is deliberately NOT compared before and
                // after. The line sits at the mid price, which is inside the candle
                // bodies, so an opaque line drawn over opaque candles recolours
                // existing pixels and the total legitimately does not move. Whether
                // it moves depends on how many candles happen to be on screen.
                const candlesBefore = mainChartPixels();
                if (candlesBefore.bodyPixels === 0) {
                    throw new Error('No candle bodies to compare the second series against.');
                }

                if (linePixels === 0) throw new Error('The line series drew no pixels.');
                // The line must sit in the middle band of the plot. A transform
                // that ignored the pixel ratio would put it near the top quarter.
                const meanY = lineYSum / linePixels;
                const band = frame.h * 0.15;
                if (meanY < frame.h / 2 - band || meanY > frame.h / 2 + band) {
                    throw new Error(
                        `The line sits at y=${meanY.toFixed(0)} of ${frame.h}, outside the middle band; `
                        + 'it was not transformed by the pixel ratio.',
                    );
                }
                const gutterDevice = Math.round(
                    chart.options().layout.priceAxisWidth * (frame.w / dataCanvas.clientWidth),
                );
                if (lineMinX < gutterDevice) {
                    throw new Error(`The line starts at x=${lineMinX}, inside the ${gutterDevice}px price gutter.`);
                }
                // The candles must be pixel-identical. This is the assertion that
                // fails if two series ever share a buffer: the second upload would
                // replace the first series' geometry instead of drawing beside it.
                const candlesAfter = mainChartPixels();
                if (candlesAfter.bodyPixels !== candlesBefore.bodyPixels) {
                    throw new Error(
                        `Adding a second series changed the candle bodies: `
                        + `${candlesBefore.bodyPixels} -> ${candlesAfter.bodyPixels} pixels.`,
                    );
                }

                lineReport = {
                    pixels: linePixels,
                    spanPx: lineMaxX - lineMinX + 1,
                    meanY: Math.round(meanY),
                    bufferHeight: frame.h,
                    candleBodyPixels: candlesAfter.bodyPixels,
                };
            }

            // --- Volume histogram ------------------------------------------
            // Volume is a second data channel on the same record, and the
            // histogram is a second series on the same layer. Both facts are
            // asserted here: that the bars are drawn, and that they are drawn from
            // the aggregated level so the totals still agree with full resolution.
            let volumeReport = null;
            {
                const t0 = Date.UTC(2025, 2, 3);
                const host = document.createElement('div');
                host.style.cssText = 'position:absolute;left:-9999px;width:600px;height:300px';
                document.body.appendChild(host);

                // A volume spike in the middle of the series, so a reducer that
                // sampled rather than summed would be visible in the total.
                const series = Array.from({ length: 400 }, (_, i) => {
                    const open = 100 + (i % 7);
                    const close = open + ((i % 5) - 2) * 0.25;
                    return {
                        time: t0 + i * 60_000,
                        open,
                        close,
                        high: Math.max(open, close) + 1,
                        low: Math.min(open, close) - 1,
                        volume: i === 200 ? 90_000 : 500 + (i % 97),
                    };
                });
                const totalVolume = series.reduce((sum, c) => sum + c.volume, 0);

                const volumeChart = new Chart(host, {
                    theme: 'dark',
                    volume: { visible: true, heightRatio: 0.25 },
                });
                volumeChart.setData(series);

                const ctx = host.querySelectorAll('canvas')[1].getContext('webgl2');
                let buf = null;
                const originalElements = ctx.drawElements.bind(ctx);
                ctx.drawElements = (...a) => {
                    const o = originalElements(...a);
                    buf = new Uint8Array(ctx.drawingBufferWidth * ctx.drawingBufferHeight * 4);
                    ctx.readPixels(0, 0, ctx.drawingBufferWidth, ctx.drawingBufferHeight, ctx.RGBA, ctx.UNSIGNED_BYTE, buf);
                    return o;
                };
                volumeChart.applyOptions({ crosshair: { visible: true } });
                await waitFrame();
                ctx.drawElements = originalElements;
                if (!buf) throw new Error('No data-layer pixels captured for the histogram.');

                const W = ctx.drawingBufferWidth;
                const H = ctx.drawingBufferHeight;
                const dpr = W / host.querySelectorAll('canvas')[1].clientWidth;
                const gutter = Math.round(78 * dpr);
                const timeGutter = Math.round(22 * dpr);
                // readPixels is bottom-up, so the visually bottom strip is the LOW
                // rows. The histogram occupies the bottom `heightRatio` of the plot,
                // sitting directly above the time gutter.
                const plotHeight = H - timeGutter;
                const stripTopRow = timeGutter + plotHeight * volumeChart.options().volume.heightRatio;
                let barPixels = 0;
                let minY = Infinity, maxY = -1, minX = Infinity, maxX = -1;
                for (let y = 0; y < Math.floor(stripTopRow); y++) {
                    if (y < timeGutter) continue;
                    for (let x = gutter; x < W; x++) {
                        const i = (y * W + x) * 4;
                        if (buf[i + 3] <= 16) continue;
                        // Bars are translucent over the plot background, so treat any
                        // pixel that is not the background itself as bar coverage.
                        const isBackground = buf[i] < 40 && buf[i + 1] < 50 && buf[i + 2] < 60;
                        if (isBackground) continue;
                        barPixels++;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                    }
                }
                if (barPixels === 0) throw new Error('The histogram drew no bars.');
                // The spike must reach the top of the strip, which is only true if
                // the bars are scaled against the peak volume on screen.
                if (maxY < stripTopRow * 0.9) {
                    throw new Error(
                        `The tallest bar reaches only row ${maxY} of a strip topping out at `
                        + `${Math.floor(stripTopRow)}; the volume spike is not scaled to the peak.`,
                    );
                }
                if (minX < gutter) throw new Error(`Histogram bar starts at x=${minX}, inside the ${gutter}px gutter.`);

                // Now zoom out until the pyramid is aggregating, and check the
                // aggregated total still matches the source.
                let aggregatedTotal = 0;
                for (const barSpacing of [6, 3, 1.5, 0.8]) {
                    volumeChart.applyOptions({ timeScale: { barSpacing } });
                    await waitFrame();
                    const out = volumeChart.options();
                    if (!out) throw new Error('options() returned nothing.');
                }
                // The public read API exposes per-candle volume, so the aggregated
                // level's total is checked through the pyramid's own invariant in
                // the unit tests; here the check is that every retained candle
                // still reports the volume it was given.
                let reported = 0;
                for (let i = 0; i < volumeChart.getCandleCount(); i++) {
                    reported += volumeChart.getCandleAt(i).volume ?? 0;
                }
                if (Math.abs(reported - totalVolume) > totalVolume * 1e-4) {
                    throw new Error(`Read-back volume ${reported} does not match the source total ${totalVolume}.`);
                }
                const spike = volumeChart.getCandleAt(200);
                if (!spike || spike.volume !== 90_000) {
                    throw new Error(`The volume spike did not survive: read ${spike && spike.volume}.`);
                }

                volumeReport = {
                    bars: barPixels,
                    stripRows: [minY, maxY],
                    stripTopRow: Math.floor(stripTopRow),
                    spikeVolume: spike.volume,
                    reportedTotal: Math.round(reported),
                    sourceTotal: totalVolume,
                };
                volumeChart.destroy();
                host.remove();
            }

            // --- Candle styles ---------------------------------------------
            // All six render the same OHLC data on the same axes, so each is
            // checked by the shape of what it draws rather than by a colour: a
            // filled body, an outline, a tick, a full-width rule, a thin polyline,
            // and a fill that reaches the bottom of the plot.
            let styleReport = null;
            {
                const t0 = Date.UTC(2025, 4, 1);
                const series = Array.from({ length: 60 }, (_, i) => {
                    const open = 100 + (i % 9);
                    const close = open + ((i % 5) - 2) * 0.5;
                    return {
                        time: t0 + i * 60_000, open, close,
                        high: Math.max(open, close) + 0.7, low: Math.min(open, close) - 0.7,
                    };
                });

                const measureStyle = async (style) => {
                    const host = document.createElement('div');
                    host.style.cssText = 'position:absolute;left:-9999px;width:600px;height:320px';
                    document.body.appendChild(host);
                    const chart = new Chart(host, { theme: 'dark', candlestick: { style } });
                    chart.setData(series);
                    const gl = host.querySelectorAll('canvas')[1].getContext('webgl2');
                    const W = gl.drawingBufferWidth, H = gl.drawingBufferHeight;
                    let buf = null;
                    const oa = gl.drawArrays.bind(gl), oe = gl.drawElements.bind(gl);
                    gl.drawArrays = (...a) => { const o = oa(...a); buf = new Uint8Array(W * H * 4); gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, buf); return o; };
                    gl.drawElements = (...a) => { const o = oe(...a); buf = new Uint8Array(W * H * 4); gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, buf); return o; };
                    chart.applyOptions({ crosshair: { visible: true } });
                    await waitFrame();
                    gl.drawArrays = oa; gl.drawElements = oe;
                    if (!buf) throw new Error(`No pixels captured for style ${style}.`);

                    let solid = 0, faint = 0, translucent = 0, widestRun = 0, minY = Infinity, maxY = -1;
                    for (let y = 0; y < H; y++) {
                        let run = 0;
                        for (let x = 0; x < W; x++) {
                            const a = buf[(y * W + x) * 4 + 3];
                            if (a > 0) faint++;
                            // "Translucent" now means part-alpha, not sub-threshold:
                            // with premultiplied blending a 25% fill lands at 64, not 16.
                            if (a > 16 && a < 250) translucent++;
                            if (a > 16) { solid++; run++; if (run > widestRun) widestRun = run; }
                            else run = 0;
                        }
                    }
                    // Row extent, tracked separately so the column run above stays simple.
                    for (let y = 0; y < H; y++) {
                        let any = false;
                        for (let x = 0; x < W; x++) if (buf[(y * W + x) * 4 + 3] > 16) { any = true; break; }
                        if (any) { if (y < minY) minY = y; if (y > maxY) maxY = y; }
                    }
                    const measured = { solid, faint, translucent, widestRun, minY, maxY, width: W, height: H };
                    chart.destroy();
                    host.remove();
                    return measured;
                };

                const candlestick = await measureStyle('candlestick');
                const hollow = await measureStyle('hollow');
                const ohlc = await measureStyle('ohlc');
                const baseline = await measureStyle('baseline');
                const line = await measureStyle('line');
                const area = await measureStyle('area');

                for (const [name, s] of Object.entries({ candlestick, hollow, ohlc, baseline, line, area })) {
                    if (s.solid === 0) throw new Error(`Style ${name} drew nothing.`);
                }
                // A hollow candle is an outline, so it must be markedly lighter
                // than the filled body it replaces.
                if (hollow.solid >= candlestick.solid * 0.5) {
                    throw new Error(`Hollow (${hollow.solid}px) is not much lighter than filled (${candlestick.solid}px); the body is probably still filled.`);
                }
                // The baseline rule is a single horizontal span, so it must
                // produce a much longer run than any bar-shaped style.
                if (baseline.widestRun < candlestick.width / 2) {
                    throw new Error(`Baseline widest run ${baseline.widestRun}px of ${candlestick.width}px; the rule is not horizontal.`);
                }
                // A polyline is thin: no single run may span the plot.
                if (line.widestRun > line.width / 8) {
                    throw new Error(`Line widest run ${line.widestRun}px of ${line.width}px; it is not a thin polyline.`);
                }
                // The area fill must be part-alpha rather than opaque, and must
                // reach below the line, which a polyline alone never does.
                if (area.translucent < 100) {
                    throw new Error(`The area fill has only ${area.translucent} translucent pixels; it is drawing as opaque.`);
                }
                // No assertion on the line's own alpha: a one-pixel diagonal stroke
                // legitimately produces partial-coverage pixels, and the fill is the
                // thing whose translucency is a deliberate, testable choice.
                if (area.minY >= line.minY) {
                    throw new Error(`Area fill starts at y=${area.minY} but the line starts at ${line.minY}; the fill does not extend below the line.`);
                }
                // Switching between the body-drawing styles must not move the
                // price scale, or the renderings would not be comparable. Line and
                // area plot closes only, so they span less and are excluded.
                const reference = JSON.stringify([candlestick.minY, candlestick.maxY]);
                for (const [name, s] of Object.entries({ hollow, ohlc, baseline })) {
                    if (JSON.stringify([s.minY, s.maxY]) !== reference) {
                        throw new Error(`Style ${name} changed the vertical extent to [${s.minY},${s.maxY}] from [${candlestick.minY},${candlestick.maxY}].`);
                    }
                }

                styleReport = {
                    candlestick: candlestick.solid,
                    hollow: hollow.solid,
                    ohlc: ohlc.solid,
                    baseline: [baseline.solid, baseline.widestRun],
                    line: [line.solid, line.widestRun],
                    area: [area.solid, area.translucent],
                    lineTranslucent: line.translucent,
                };
            }

            // --- Axis gutters ---------------------------------------------
            // Series are confined to the plot rect, and the axis labels live in
            // the gutters outside it. A bar scrolled part-way past an edge must
            // be clipped rather than painting over the price labels, which is
            // only observable by reading both layers.
            let gutterReport = null;
            {
                const layout = optionsChart.options().layout;
                const gridCanvas = optionsHost.querySelectorAll('canvas')[0];
                const dataCtx = optionsHost.querySelectorAll('canvas')[1].getContext('webgl2');
                const gridCtx = gridCanvas.getContext('2d');
                const priceGutter = layout.priceAxisWidth;
                const timeGutter = layout.timeAxisHeight;
                // Everything below is in DEVICE pixels. The canvas backing stores
                // are sized by the pixel ratio while the options are CSS pixels, so
                // mixing the two silently halves every threshold at dpr 2.
                const devW = gridCanvas.width;
                const devH = gridCanvas.height;
                const dpr = devW / gridCanvas.clientWidth;
                const gutterPx = Math.round(priceGutter * dpr);
                const timePx = Math.round(timeGutter * dpr);

                let pixels = null, bufW = 0, bufH = 0;
                const originalElements = dataCtx.drawElements.bind(dataCtx);
                dataCtx.drawElements = (...args) => {
                    const out = originalElements(...args);
                    bufW = dataCtx.drawingBufferWidth;
                    bufH = dataCtx.drawingBufferHeight;
                    pixels = new Uint8Array(bufW * bufH * 4);
                    dataCtx.readPixels(0, 0, bufW, bufH, dataCtx.RGBA, dataCtx.UNSIGNED_BYTE, pixels);
                    return out;
                };
                optionsChart.applyOptions({ crosshair: { visible: true } });
                await waitFrame();
                dataCtx.drawElements = originalElements;
                if (!pixels) throw new Error('No data-layer pixels were captured for the gutter check.');
                if (bufW !== devW || bufH !== devH) {
                    throw new Error(`Data layer is ${bufW}x${bufH} but the axis layer is ${devW}x${devH}.`);
                }

                // readPixels is bottom-up; canvas rows run top-down.
                let leftGutterData = 0, bottomGutterData = 0, totalData = 0;
                for (let y = 0; y < bufH; y++) {
                    for (let x = 0; x < bufW; x++) {
                        if (pixels[(y * bufW + x) * 4 + 3] <= 16) continue;
                        totalData++;
                        if (x < gutterPx) leftGutterData++;
                        if (y < timePx) bottomGutterData++;
                    }
                }
                if (totalData === 0) throw new Error('The chart drew no data to check against the gutters.');
                if (leftGutterData > 0) {
                    throw new Error(`${leftGutterData} data pixels are inside the ${priceGutter}px price gutter; series are not clipped to the plot.`);
                }
                if (bottomGutterData > 0) {
                    throw new Error(`${bottomGutterData} data pixels are inside the ${timeGutter}px time gutter; series are not clipped to the plot.`);
                }

                // Labels must sit in the gutter, not over the plot.
                const image = gridCtx.getImageData(0, 0, devW, devH).data;
                const pixelAt = (x, y) => {
                    const i = (y * devW + x) * 4;
                    return { r: image[i], g: image[i + 1], b: image[i + 2] };
                };
                const background = pixelAt(2, 2);
                const isInk = (c) => Math.abs(c.r - background.r) + Math.abs(c.g - background.g) + Math.abs(c.b - background.b) > 40;

                let priceLabelInk = 0;
                for (let y = 4; y < devH - timePx - 2; y++) {
                    for (let x = 0; x < gutterPx; x++) if (isInk(pixelAt(x, y))) priceLabelInk++;
                }
                if (priceLabelInk === 0) throw new Error('No price labels were drawn in the price gutter.');

                let timeLabelInk = 0;
                for (let y = devH - timePx; y < devH; y++) {
                    for (let x = 0; x < devW; x++) if (isInk(pixelAt(x, y))) timeLabelInk++;
                }
                if (timeLabelInk === 0) throw new Error('No time labels were drawn in the time gutter.');

                gutterReport = {
                    priceAxisPx: priceLabelInk,
                    timeAxisPx: timeLabelInk,
                    dataPixels: totalData,
                    priceAxisWidth: priceGutter,
                    timeAxisHeight: timeGutter,
                    dpr,
                };
            }

            // --- Border frame across pixel ratios ---------------------------
            // The body edges are snapped to whole device pixels, and the snap is
            // floor(device + 0.5). A body edge sitting on a whole CSS pixel puts
            // `position * pixelRatio` on a half-integer at every odd-tenth ratio,
            // where that snap is knife-edge: the two edges of a one-pixel frame
            // then round independently and the frame comes out two pixels thick
            // or not at all. This sweeps the ratio so that cannot regress, and
            // checks the frame is exactly the body perimeter with the body bounds
            // and footprint untouched by turning it on.
            {
                const sweepOptions = {
                    upColor: '#00ff00', borderUpColor: '#ff0000',
                    downColor: '#0000ff', borderDownColor: '#ff00ff',
                    wickVisible: false, borderVisible: true,
                };
                // A bearish sibling in blue with a magenta frame sets the vertical
                // scale and stays separable from the green target at any ratio.
                const sweepCandles = [
                    { time: baseTime, open: 140, high: 140, low: 60, close: 60 },
                    { time: baseTime + 60000, open: 90, high: 110, low: 90, close: 110 },
                ];
                const readBody = async (borderVisible) => {
                    // A fresh host per measurement. Sharing one lets a previous
                    // chart's canvas be picked up by index, which silently measures
                    // a stale frame from a different viewport.
                    const host = document.createElement('div');
                    host.style.cssText = 'position:absolute;left:-9999px;width:401px;height:240px';
                    document.body.appendChild(host);
                    const chart = new Chart(host, {
                        theme: 'dark',
                        candlestick: { ...sweepOptions, borderVisible },
                    });
                    chart.setData(sweepCandles);
                    const canvas = host.querySelectorAll('canvas')[1];
                    const gl = canvas.getContext('webgl2');
                    let result = null;
                    const draw = gl.drawElements.bind(gl);
                    gl.drawElements = (...args) => {
                        const out = draw(...args);
                        const W = gl.drawingBufferWidth, H = gl.drawingBufferHeight;
                        const px = new Uint8Array(W * H * 4);
                        gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
                        const at = (x, y) => {
                            const i = (y * W + x) * 4;
                            return { r: px[i], g: px[i + 1], b: px[i + 2], a: px[i + 3] };
                        };
                        // The target is the only green fill or red frame on the layer.
                        const inTarget = (c) => (c.a > 200 && c.r > 200 && c.g < 60 && c.b < 60)
                            || (c.a > 200 && c.g > 200 && c.r < 60 && c.b < 60);
                        let minX = Infinity, maxX = -1, minY = Infinity, maxY = -1;
                        for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
                            if (!inTarget(at(x, y))) continue;
                            if (x < minX) minX = x; if (x > maxX) maxX = x;
                            if (y < minY) minY = y; if (y > maxY) maxY = y;
                        }
                        if (maxX < 0) return out;
                        let frame = 0, interior = 0, footprint = 0;
