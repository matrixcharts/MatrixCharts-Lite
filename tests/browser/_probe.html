<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>dpr sweep</title>
<style>body{margin:0;background:#222;color:#ddd;font:11px monospace;padding:8px}
pre{font:10px monospace;line-height:1.0}</style>
</head>
<body>
<pre id="out">running</pre>
<script type="module">
    import { Chart } from '../../src/index.ts';

    window.requestAnimationFrame = (cb) => window.setTimeout(() => cb(performance.now()), 16);
    window.cancelAnimationFrame = (id) => window.clearTimeout(id);
    Object.defineProperty(document, 'visibilityState', { configurable: true, value: 'visible' });

    const wait = (n) => new Promise((r) => { let i = 0; const step = () => (++i >= n ? r() : requestAnimationFrame(step)); requestAnimationFrame(step); });
    const setDpr = (d) => Object.defineProperty(window, 'devicePixelRatio', { configurable: true, value: d });

    const OPTS = { upColor: '#00ff00', borderUpColor: '#ff0000', downColor: '#0000ff', borderDownColor: '#ff00ff', wickVisible: false, borderVisible: true };

    /** Grabs the pixel grid plus counts on the next draw of the data layer. */
    function probe(host, wantGrid) {
        const canvas = host.querySelectorAll('canvas')[1];
        const gl = canvas.getContext('webgl2');
        const orig = gl.drawElements.bind(gl);
        let snap = null;
        gl.drawElements = (...args) => {
            const result = orig(...args);
            const W = gl.drawingBufferWidth, H = gl.drawingBufferHeight;
            const px = new Uint8Array(W * H * 4);
            gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
            const at = (x, y) => { const i = (y * W + x) * 4; return { r: px[i], g: px[i + 1], b: px[i + 2], a: px[i + 3] }; };
            const isFrame = (c) => c.a > 200 && c.r > 200 && c.g < 60 && c.b < 60;
            const isFill  = (c) => c.a > 200 && c.g > 200 && c.r < 60 && c.b < 60;
            const isSib   = (c) => c.a > 200 && c.b > 200 && (c.g < 60 || c.r > 200);

            let minX = Infinity, maxX = -1, minY = Infinity, maxY = -1;
            for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
                const c = at(x, y);
                if (!isFrame(c) && !isFill(c)) continue;
                if (x < minX) minX = x; if (x > maxX) maxX = x;
                if (y < minY) minY = y; if (y > maxY) maxY = y;
            }
            if (maxX < 0) { snap = { empty: true }; return result; }
            const w = maxX - minX + 1, h = maxY - minY + 1;
            let frame = 0, interior = 0;
            for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
                if (!isFrame(at(x, y))) continue;
                frame++;
                if (x > minX && x < maxX && y > minY && y < maxY) interior++;
            }
            snap = { w, h, frame, interior, expect: (w > 3 && h > 3) ? 2 * (w + h) - 4 : 0 };
            if (wantGrid) {
                const ch = (x, y) => { const c = at(x, y); return isFrame(c) ? 'R' : isFill(c) ? 'G' : isSib(c) ? 'B' : c.a > 16 ? '?' : '.'; };
                const rows = [];
                for (let y = minY; y <= maxY; y++) { let l = ''; for (let x = minX; x <= maxX; x++) l += ch(x, y); rows.push(l); }
                snap.grid = rows;
            }
            return result;
        };
        return () => snap;
    }

    async function measure(dpr, candles, w, h, wantGrid) {
        setDpr(dpr);
        const host = document.createElement('div');
        host.style.cssText = `position:absolute;left:-9999px;width:${w}px;height:${h}px`;
        document.body.appendChild(host);
        const chart = new Chart(host, { theme: 'dark', candlestick: OPTS });
        chart.setData(candles);
        const p = probe(host, wantGrid);
        await wait(1);
        chart.applyOptions({ crosshair: { visible: true } });
        await wait(1);
        const s = p();
        chart.destroy();
        host.remove();
        return s;
    }

    const t = Date.UTC(2025, 0, 1);
    const candles = [
        { time: t, open: 140, high: 140, low: 60, close: 60 },
        { time: t + 60000, open: 90, high: 110, low: 90, close: 110 },
    ];

    // Dense dpr sweep: is 2.5 a special case, or is fractional dpr the trigger?
    const rows = [];
    const dprs = [];
    for (let d = 1; d <= 3.0001; d += 0.05) dprs.push(Math.round(d * 100) / 100);
    dprs.push(1.1, 1.75, 2.25, 2.75, 3.5, 4);
    for (const dpr of dprs) {
        const s = await measure(dpr, candles, 401, 240, false);
        if (!s || s.empty) { rows.push([dpr, 'empty', '', '', '']); continue; }
        rows.push([dpr, `${s.w}x${s.h}`, s.frame, s.expect, s.frame === s.expect ? 'ok' : `FAIL +${s.frame - s.expect} int=${s.interior}`]);
    }
    const bad = rows.filter((r) => String(r[4]).startsWith('FAIL'));

    // Character map at the first failing dpr.
    let map = null;
    if (bad.length) {
        const s = await measure(Number(bad[0][0]), candles, 401, 240, true);
        map = s && s.grid ? { dpr: Number(bad[0][0]), w: s.w, h: s.h, frame: s.frame, expect: s.expect, rows: s.grid } : null;
    }

    document.getElementById('out').textContent = [
        `dpr sweep, ${rows.length} configs (step 0.05 from 1.00 to 3.00)`,
        'dpr     body      frame  expect  result',
        rows.map((r) => `  ${String(r[0]).padEnd(6)} ${String(r[1]).padEnd(9)} ${String(r[2]).padStart(5)} ${String(r[3]).padStart(6)}  ${r[4]}`).join('\n'),
        '',
        `FAILING dpr: ${bad.length ? bad.map((r) => r[0]).join(', ') : 'none'}`,
        '',
        map ? `PIXEL MAP at dpr=${map.dpr} (body ${map.w}x${map.h}, frame=${map.frame}, expected=${map.expect})`
            : 'no failing dpr to map',
        ...(map ? map.rows.map((r, i) => `  y=${String(i).padStart(3)} |${r}|`) : []),
    ].join('\n');
    document.documentElement.dataset.probe = 'done';
</script>
</body>
</html>
