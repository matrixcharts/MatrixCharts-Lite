<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatrixCharts Engine Test</title>
    <style>
        :root {
            color-scheme: dark;
            --page-bg: #0d1117;
            --page-fg: #c9d1d9;
            --control-bg: #161b22;
            --control-border: #39424e;
            --accent: #35c9a0;
        }
        body[data-theme="paper"] {
            color-scheme: light;
            --page-bg: #eeeae0;
            --page-fg: #30363b;
            --control-bg: #faf8f1;
            --control-border: #c8c2b5;
            --accent: #287a62;
        }
        body {
            background-color: var(--page-bg);
            color: var(--page-fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 40px;
        }
        h2 {
            margin-bottom: 20px;
            font-weight: 500;
        }
        .feed-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            width: min(800px, 100%);
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .feed-controls select,
        .feed-controls input,
        .feed-controls button {
            min-height: 34px;
            border: 1px solid var(--control-border);
            border-radius: 4px;
            background: var(--control-bg);
            color: var(--page-fg);
            padding: 0 10px;
            font: inherit;
        }
        .feed-controls input {
            flex: 1 1 240px;
        }
        .feed-controls button {
            cursor: pointer;
        }
        .feed-controls button:hover {
            border-color: var(--accent);
        }
        .feed-controls input[type="color"] {
            width: 34px;
            min-height: 34px;
            padding: 2px;
        }
        .swatch {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #8b949e;
        }
        #feed-status {
            margin-left: auto;
            color: #8b949e;
            font-size: 13px;
        }
        /* Phase 2 read API: OHLC for the bar under the pointer, read from the
           public API only. No private field access. */
        #readout {
            width: min(800px, 100%);
            margin-bottom: 12px;
            padding: 10px 12px;
            border: 1px solid var(--control-border);
            border-radius: 4px;
            background: var(--control-bg);
            font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
            white-space: pre-wrap;
        }
        #readout .muted { color: #8b949e; }
        /* This is the target container we pass to the library */
        #chart-container {
            width: 800px;
            height: 500px;
            background-color: var(--control-bg);
            border: 1px solid var(--control-border);
            border-radius: 6px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            resize: both;
            overflow: hidden; /* Allows you to drag the corner to test the ResizeObserver */
        }
    </style>
</head>
<body>
    <h2>MatrixCharts Layered Architecture</h2>
    <div class="feed-controls">
        <select id="chart-theme" aria-label="Chart theme">
            <option value="dark">Dark</option>
            <option value="paper">Paper</option>
        </select>
        <label class="swatch">Up <input id="candle-up" type="color" value="#1ad98c" aria-label="Up candle colour"></label>
        <label class="swatch">Down <input id="candle-down" type="color" value="#f24059" aria-label="Down candle colour"></label>
        <label class="swatch">Wicks
            <select id="candle-wicks" aria-label="Wick visibility">
                <option value="true">on</option>
                <option value="false">off</option>
            </select>
        </label>
        <label class="swatch">Borders
            <select id="candle-borders" aria-label="Body border visibility">
                <option value="false">off</option>
                <option value="true">on</option>
            </select>
        </label>
        <label class="swatch">Style
            <select id="candle-style" aria-label="Candle rendering style">
                <option value="candlestick">candlestick</option>
                <option value="hollow">hollow</option>
                <option value="ohlc">ohlc</option>
                <option value="baseline">baseline</option>
                <option value="line">line</option>
                <option value="area">area</option>
            </select>
        </label>
        <label class="swatch">Volume
            <select id="volume-visible" aria-label="Volume histogram visibility">
                <option value="false">off</option>
                <option value="true">on</option>
            </select>
        </label>
        <label class="swatch">Cross
            <select id="crosshair-visible" aria-label="Crosshair visibility">
                <option value="true">on</option>
                <option value="false">off</option>
            </select>
        </label>
        <label class="swatch">Grid
            <select id="grid-mode" aria-label="Grid lines">
                <option value="both">both</option>
                <option value="vert">vertical</option>
                <option value="horz">horizontal</option>
                <option value="none">none</option>
            </select>
        </label>
        <label class="swatch">Dp
            <select id="price-precision" aria-label="Price precision">
                <option value="0">0</option>
                <option value="2" selected>2</option>
                <option value="4">4</option>
            </select>
        </label>
        <select id="feed-kind" aria-label="Feed type">
            <option value="mock">Mock feed</option>
            <option value="websocket">WebSocket</option>
        </select>
        <input id="feed-url" type="url" value="ws://localhost:8080" aria-label="WebSocket URL" hidden>
        <button id="feed-connect" type="button">Connect</button>
        <button id="feed-disconnect" type="button" disabled>Disconnect</button>
        <span id="feed-status" role="status">disconnected</span>
    </div>
    <div id="readout">move the pointer over the chart</div>

    <!-- The Empty Container -->
    <div id="chart-container"></div>

<!-- Initialize the library -->
    <script type="module">
        import {
            Chart,
            ChartFeedController,
            MockCandleSource,
            WebSocketCandleSource,
        } from './src/index.ts';

        const theme = document.querySelector('#chart-theme');
        const container = document.getElementById('chart-container');
        const chart = new Chart(container, { theme: theme.value });
        const kind = document.querySelector('#feed-kind');
        const url = document.querySelector('#feed-url');
        const connectButton = document.querySelector('#feed-connect');
        const disconnectButton = document.querySelector('#feed-disconnect');
        const status = document.querySelector('#feed-status');
        const readout = document.querySelector('#readout');
        let feedController = null;

        // Everything below is public API from the v1 contract: the demo never
        // reaches into offsetX, scaleX, or the candle store, and it does not
        // re-implement hit-testing to find the bar under the pointer.
        const formatPrice = (value) => value.toFixed(2);
        const formatIndex = (value) => Number.isInteger(value) ? String(value) : value.toFixed(2);
        const paintReadout = () => {
            const count = chart.getCandleCount();
            const range = chart.getVisibleLogicalRange();
            const times = chart.getVisibleTimeRange();
            if (count === 0) {
                readout.innerHTML = '<span class="muted">no data</span>';
                return;
            }
            const spacing = formatIndex(chart.getBarSpacing());
            const visible = `${formatIndex(range.from)}..${formatIndex(range.to)} of ${count}`;
            const window_ = times
                ? `${new Date(times.from).toISOString().slice(0, 16).replace('T', ' ')} .. ${new Date(times.to).toISOString().slice(0, 16).replace('T', ' ')}`
                : 'off screen';
            readout.textContent = `barSpacing ${spacing}px   visible ${visible}   time ${window_}`;
        };

        chart.subscribeCrosshairMove((event) => {
            if (!event.candle) {
                paintReadout();
                return;
            }
            const candle = event.candle;
            readout.textContent = [
                `index ${event.index}   x ${event.x.toFixed(1)}   y ${event.y.toFixed(1)}   t ${new Date(event.time).toISOString()}`,
                `O ${formatPrice(candle.open)}  H ${formatPrice(candle.high)}  L ${formatPrice(candle.low)}  C ${formatPrice(candle.close)}`,
                `price at pointer ${formatPrice(event.price)}   round trip x ${chart.indexToCoordinate(event.index).toFixed(1)}`,
            ].join('\n');
        });

        chart.subscribeClick((event) => {
            status.textContent = event.candle
                ? `clicked index ${event.index} @ ${new Date(event.time).toISOString().slice(11, 19)}`
                : `clicked empty space (button ${event.button})`;
        });

        chart.subscribeVisibleRangeChange((event) => {
            const from = event.logical.from;
            const to = event.logical.to;
            const span = event.time
                ? `${new Date(event.time.from).toISOString().slice(5, 16).replace('T', ' ')} .. ${new Date(event.time.to).toISOString().slice(5, 16).replace('T', ' ')}`
                : 'off screen';
            status.title = `visible ${formatIndex(from)}..${formatIndex(to)} at ${formatIndex(event.barSpacing)}px/bar  ${span}`;
        });

        theme.addEventListener('change', () => {
            // Phase 4: the theme toggle is just an applyOptions call. Colours the
            // user set explicitly below survive the preset switch.
            restyle({ theme: theme.value }, `theme ${theme.value}`);
            document.body.dataset.theme = theme.value;
            syncSwatchesToOptions();
        });

        const upInput = document.querySelector('#candle-up');
        const downInput = document.querySelector('#candle-down');
        const wicksInput = document.querySelector('#candle-wicks');
        const bordersInput = document.querySelector('#candle-borders');
        const volumeInput = document.querySelector('#volume-visible');
        const styleInput = document.querySelector('#candle-style');
        const crosshairInput = document.querySelector('#crosshair-visible');
        const gridInput = document.querySelector('#grid-mode');
        const precisionInput = document.querySelector('#price-precision');

        /**
         * Wraps applyOptions so a rejected value surfaces in the status line
         * instead of an uncaught exception. `priceFormat.precision` and
         * `minMove` must agree, so they are always sent as a pair.
         */
        const restyle = (partial, label) => {
            try {
                chart.applyOptions(partial);
                status.textContent = label;
            } catch (error) {
                status.textContent = error instanceof Error ? error.message : 'invalid option';
                syncSwatchesToOptions();
            }
        };

        upInput.addEventListener('input', () => {
            restyle({ candlestick: { upColor: upInput.value } }, `up ${upInput.value}`);
        });
        downInput.addEventListener('input', () => {
            restyle({ candlestick: { downColor: downInput.value } }, `down ${downInput.value}`);
        });
        wicksInput.addEventListener('change', () => {
            restyle({ candlestick: { wickVisible: wicksInput.value === 'true' } }, `wicks ${wicksInput.value}`);
        });
        bordersInput.addEventListener('change', () => {
            restyle({ candlestick: { borderVisible: bordersInput.value === 'true' } }, `borders ${bordersInput.value}`);
        });
        volumeInput.addEventListener('change', () => {
            restyle({ volume: { visible: volumeInput.value === 'true' } }, `volume ${volumeInput.value}`);
        });
        styleInput.addEventListener('change', () => {
            restyle({ candlestick: { style: styleInput.value } }, `style ${styleInput.value}`);
        });
        crosshairInput.addEventListener('change', () => {
            restyle({ crosshair: { visible: crosshairInput.value === 'true' } }, `crosshair ${crosshairInput.value}`);
        });
        gridInput.addEventListener('change', () => {
            restyle({
                grid: {
                    vertLines: gridInput.value === 'both' || gridInput.value === 'vert',
                    horzLines: gridInput.value === 'both' || gridInput.value === 'horz',
                },
            }, `grid ${gridInput.value}`);
        });
        precisionInput.addEventListener('change', () => {
            const precision = Number(precisionInput.value);
            // A precision that cannot show the tick size is rejected, so widen
            // minMove together with it.
            restyle({ priceFormat: { precision, minMove: Math.pow(10, -precision) } }, `precision ${precision}`);
        });

        /** Reflects the resolved snapshot back into the controls after a theme change. */
        const syncSwatchesToOptions = () => {
            const options = chart.options();
            upInput.value = options.candlestick.upColor;
            downInput.value = options.candlestick.downColor;
            wicksInput.value = String(options.candlestick.wickVisible);
            bordersInput.value = String(options.candlestick.borderVisible);
            styleInput.value = options.candlestick.style;
            crosshairInput.value = String(options.crosshair.visible);
            gridInput.value = options.grid.vertLines && options.grid.horzLines
                ? 'both'
                : options.grid.vertLines ? 'vert' : options.grid.horzLines ? 'horz' : 'none';
            precisionInput.value = String(options.priceFormat.precision);
        };

        kind.addEventListener('change', () => {
            url.hidden = kind.value !== 'websocket';
        });

        connectButton.addEventListener('click', () => {
            if (feedController) feedController.dispose();
            chart.setData([]);
            paintReadout();
            const source = kind.value === 'mock'
                ? new MockCandleSource()
                : new WebSocketCandleSource(url.value);
            feedController = new ChartFeedController(
                chart,
                source,
                (state) => { status.textContent = state; },
                (error) => {
                    status.textContent = error instanceof Error ? error.message : 'feed error';
                    console.error(error);
                },
            );
            connectButton.disabled = true;
            disconnectButton.disabled = false;
        });

        disconnectButton.addEventListener('click', () => {
            if (feedController) feedController.dispose();
            feedController = null;
            chart.setData([]);
            paintReadout();
            status.textContent = 'disconnected';
            connectButton.disabled = false;
            disconnectButton.disabled = true;
        });

        window.addEventListener('beforeunload', () => {
            if (feedController) feedController.dispose();
            chart.destroy();
        });

        connectButton.click();
        // Keep the idle readout in step with a live feed that appends on its own.
        setInterval(paintReadout, 500);
    </script>
</body>
</html>
