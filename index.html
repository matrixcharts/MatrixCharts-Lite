<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatrixCharts Engine Test</title>
    <style>
        :root {
            color-scheme: dark;
            --page-bg: #0d1117;
            --page-fg: #c9d1d9;
            --control-bg: #161b22;
            --control-border: #39424e;
            --accent: #35c9a0;
        }
        body[data-theme="paper"] {
            color-scheme: light;
            --page-bg: #eeeae0;
            --page-fg: #30363b;
            --control-bg: #faf8f1;
            --control-border: #c8c2b5;
            --accent: #287a62;
        }
        body {
            background-color: var(--page-bg);
            color: var(--page-fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 40px;
        }
        h2 {
            margin-bottom: 20px;
            font-weight: 500;
        }
        .feed-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            width: min(800px, 100%);
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .feed-controls select,
        .feed-controls input,
        .feed-controls button {
            min-height: 34px;
            border: 1px solid var(--control-border);
            border-radius: 4px;
            background: var(--control-bg);
            color: var(--page-fg);
            padding: 0 10px;
            font: inherit;
        }
        .feed-controls input {
            flex: 1 1 240px;
        }
        .feed-controls button {
            cursor: pointer;
        }
        .feed-controls button:hover {
            border-color: var(--accent);
        }
        .feed-controls input[type="color"] {
            width: 34px;
            min-height: 34px;
            padding: 2px;
        }
        .swatch {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #8b949e;
        }
        #feed-status {
            margin-left: auto;
            color: #8b949e;
            font-size: 13px;
        }
        /* Phase 2 read API: OHLC for the bar under the pointer, read from the
           public API only. No private field access. */
        #readout {
            width: min(800px, 100%);
            margin-bottom: 12px;
            padding: 10px 12px;
            border: 1px solid var(--control-border);
            border-radius: 4px;
            background: var(--control-bg);
            font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
            white-space: pre-wrap;
        }
        #readout .muted { color: #8b949e; }
        #pane-readout {
            width: min(800px, 100%);
            margin-bottom: 12px;
            padding: 0 12px 10px;
            font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
            color: #8b949e;
        }
        /* Harness-only, for the live-edge row. Styled from the same variables as the
           feed controls so it reads as part of this page and not as library output. */
        #live-row {
            width: min(800px, 100%);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #live-row button {
            min-height: 28px;
            padding: 0 10px;
            border: 1px solid var(--control-border);
            border-radius: 4px;
            background: var(--control-bg);
            color: inherit;
            font: 12px sans-serif;
            cursor: pointer;
        }
        #live-row button:disabled {
            opacity: 0.45;
            cursor: default;
        }
        #live-row button:not(:disabled):hover {
            border-color: var(--accent);
        }
        #live-state {
            font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        /* This is the target container we pass to the library */
        #chart-container {
            width: 800px;
            height: 500px;
            background-color: var(--control-bg);
            border: 1px solid var(--control-border);
            border-radius: 6px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            resize: both;
            overflow: hidden; /* Allows you to drag the corner to test the ResizeObserver */
        }
    </style>
</head>
<body>
    <h2>MatrixCharts Layered Architecture</h2>
    <div class="feed-controls">
        <select id="chart-theme" aria-label="Chart theme">
            <option value="dark">Dark</option>
            <option value="paper">Paper</option>
        </select>
        <label class="swatch">Up <input id="candle-up" type="color" value="#1ad98c" aria-label="Up candle colour"></label>
        <label class="swatch">Down <input id="candle-down" type="color" value="#f24059" aria-label="Down candle colour"></label>
        <label class="swatch">Wicks
            <select id="candle-wicks" aria-label="Wick visibility">
                <option value="true">on</option>
                <option value="false">off</option>
            </select>
        </label>
        <label class="swatch">Borders
            <select id="candle-borders" aria-label="Body border visibility">
                <option value="false">off</option>
                <option value="true">on</option>
            </select>
        </label>
        <label class="swatch">Style
            <select id="candle-style" aria-label="Candle rendering style">
                <option value="candlestick">candlestick</option>
                <option value="hollow">hollow</option>
                <option value="ohlc">ohlc</option>
                <option value="baseline">baseline</option>
                <option value="line">line</option>
                <option value="area">area</option>
            </select>
        </label>
        <label class="swatch">Volume
            <select id="volume-visible" aria-label="Volume histogram visibility">
                <option value="false">off</option>
                <option value="true">on</option>
            </select>
        </label>
        <label class="swatch">Decorations
            <select id="decorations" aria-label="Price lines and markers">
                <option value="none">none</option>
                <option value="zones">order block zones</option>
                <option value="lines">price lines</option>
                <option value="trades">trade markers</option>
                <option value="both">zones + markers</option>
            </select>
        </label>
        <label class="swatch">Price scale
            <select id="price-scale" aria-label="Price axis scale">
                <option value="linear">linear</option>
                <option value="log">log</option>
                <option value="log,1">log + inverted</option>
                <option value="linear,1">inverted</option>
            </select>
        </label>
        <label class="swatch">Scale lock
            <select id="scale-lock" aria-label="Lock the selected pane's vertical range">
                <option value="auto">auto</option>
                <option value="locked">locked</option>
            </select>
        </label>
        <label class="swatch">Lock pane
            <select id="lock-pane" aria-label="Which pane the scale lock applies to"></select>
        </label>
        <label class="swatch">Panes
            <select id="pane-weights" aria-label="Pane layout">
                <option value="1">1 pane</option>
                <option value="3,1">price + RSI</option>
                <option value="3,1,1">price + RSI + MACD</option>
            </select>
        </label>
        <label class="swatch">Overlay
            <select id="overlay-style" aria-label="Overlay series">
                <option value="off">off</option>
                <option value="ema">EMA 21</option>
                <option value="bands">Bollinger</option>
                <option value="stops">Supertrend</option>
                <option value="mixed">per-point colour</option>
                <option value="rsi">RSI in its own pane</option>
                <option value="rsi-macd">RSI + MACD panes</option>
            </select>
        </label>
        <label class="swatch">Cross
            <select id="crosshair-visible" aria-label="Crosshair visibility">
                <option value="true">on</option>
                <option value="false">off</option>
            </select>
        </label>
        <label class="swatch">Grid
            <select id="grid-mode" aria-label="Grid lines">
                <option value="both">both</option>
                <option value="vert">vertical</option>
                <option value="horz">horizontal</option>
                <option value="none">none</option>
            </select>
        </label>
        <label class="swatch">Dp
            <select id="price-precision" aria-label="Price precision">
                <option value="0">0</option>
                <option value="2" selected>2</option>
                <option value="4">4</option>
            </select>
        </label>
        <select id="feed-kind" aria-label="Feed type">
            <option value="mock">Mock feed</option>
            <option value="websocket">WebSocket</option>
        </select>
        <input id="feed-url" type="url" value="ws://localhost:8080" aria-label="WebSocket URL" hidden>
        <button id="feed-connect" type="button">Connect</button>
        <button id="feed-disconnect" type="button" disabled>Disconnect</button>
        <span id="feed-status" role="status">disconnected</span>
    </div>
    <div id="readout">move the pointer over the chart</div>
<!-- Dev-harness UI only. The library reports `atRealtime` and nothing else: no badge,
     no overlay, no element of its own. This button and the readout tint below are what
     an application would build on top, and they live here precisely because they are not
     the library's business. -->
<div id="live-row">
    <button id="live-jump" type="button" disabled>Jump to live</button>
    <span id="live-state" role="status" aria-live="polite">—</span>
</div>
<!-- Driven only by subscribePaneRangeChange. Kept separate from the readout above
     because that one is overwritten wholesale by the crosshair handler, and a
     vertical-bounds readout that vanished every time the pointer moved would
     demonstrate the event by hiding it. -->
<div id="pane-readout" class="muted">pane bounds: —</div>

    <!-- The Empty Container -->
    <div id="chart-container"></div>

<!-- Initialize the library -->
    <script type="module">
        import {
            Chart,
            ChartFeedController,
            MockCandleSource,
            WebSocketCandleSource,
        } from './src/index.ts';

        const theme = document.querySelector('#chart-theme');
        const container = document.getElementById('chart-container');
        const chart = new Chart(container, { theme: theme.value });
        const kind = document.querySelector('#feed-kind');
        const url = document.querySelector('#feed-url');
        const connectButton = document.querySelector('#feed-connect');
        const disconnectButton = document.querySelector('#feed-disconnect');
        const status = document.querySelector('#feed-status');
        const readout = document.querySelector('#readout');
        const paneReadout = document.querySelector('#pane-readout');
        const lockPaneSelect = document.querySelector('#lock-pane');
        let feedController = null;

        // Everything below is public API from the v1 contract: the demo never
        // reaches into offsetX, scaleX, or the candle store, and it does not
        // re-implement hit-testing to find the bar under the pointer.
        const formatPrice = (value) => value.toFixed(2);
        const formatIndex = (value) => Number.isInteger(value) ? String(value) : value.toFixed(2);
        const paintReadout = () => {
            const count = chart.getCandleCount();
            const range = chart.getVisibleLogicalRange();
            const times = chart.getVisibleTimeRange();
            if (count === 0) {
                readout.innerHTML = '<span class="muted">no data</span>';
                return;
            }
            const spacing = formatIndex(chart.getBarSpacing());
            const visible = `${formatIndex(range.from)}..${formatIndex(range.to)} of ${count}`;
            const window_ = times
                ? `${new Date(times.from).toISOString().slice(0, 16).replace('T', ' ')} .. ${new Date(times.to).toISOString().slice(0, 16).replace('T', ' ')}`
                : 'off screen';
            readout.textContent = `barSpacing ${spacing}px   visible ${visible}   time ${window_}`;
        };

        // The live-edge affordance, built the way an application would build it: read a
        // boolean off the event that already fires, and offer the method that puts the
        // view back. The chart itself draws nothing and says nothing.
        const liveJump = document.querySelector('#live-jump');
        const liveState = document.querySelector('#live-state');
        const paintLive = (atRealtime) => {
            liveState.textContent = atRealtime ? 'following the feed' : 'off the live edge — panned back';
            liveState.classList.toggle('muted', atRealtime);
            liveJump.disabled = atRealtime;
        };
        liveJump.addEventListener('click', () => {
            chart.scrollToRealtime();
            paintReadout();
        });
        chart.subscribeVisibleRangeChange((event) => paintLive(event.atRealtime));
        paintLive(chart.isAtRealtime());

        chart.subscribeCrosshairMove((event) => {
            if (!event.candle) {
                paintReadout();
                return;
            }
            const candle = event.candle;
            readout.textContent = [
                `index ${event.index}   x ${event.x.toFixed(1)}   y ${event.y.toFixed(1)}   t ${new Date(event.time).toISOString()}`,
                `O ${formatPrice(candle.open)}  H ${formatPrice(candle.high)}  L ${formatPrice(candle.low)}  C ${formatPrice(candle.close)}`,
                `price at pointer ${formatPrice(event.price)}   round trip x ${chart.indexToCoordinate(event.index).toFixed(1)}`,
            ].join('\n');
        });

        chart.subscribeClick((event) => {
            status.textContent = event.candle
                ? `clicked index ${event.index} @ ${new Date(event.time).toISOString().slice(11, 19)}`
                : `clicked empty space (button ${event.button})`;
        });

        // Vertical bounds, pushed by the chart rather than polled. It fires for a drag of
        // the axis gutter, for setPaneRange and fitPaneRange, and for the auto-fit when a
        // candle prints outside the range — so this readout cannot lag the screen, which
        // is the whole reason the event exists. A version of this that only listened for
        // deliberate locks would go stale at the first new high.
        const paneName = (pane) => (pane === 0 ? 'price' : `pane ${pane}`);
        const paneBounds = new Map();
        chart.subscribePaneRangeChange((event) => {
            paneBounds.set(event.pane, event.range);
            const parts = Array.from(paneBounds.entries())
                .sort((a, b) => a[0] - b[0])
                .map(([pane, range]) => `${paneName(pane)} ${formatPrice(range[0])}..${formatPrice(range[1])}`);
            paneReadout.textContent = `pane bounds: ${parts.join('   ')}`;
        });

        // The lock controls name a pane, so the selector has to follow the layout. Names
        // are the chart's business, but which panes exist is a public question and this
        // is the public way to ask it.
        const refreshLockPanes = () => {
            const count = chart.getPaneCount();
            const previous = lockPaneSelect.value;
            lockPaneSelect.textContent = '';
            for (let pane = 0; pane < count; pane++) {
                const option = document.createElement('option');
                option.value = String(pane);
                option.textContent = paneName(pane);
                lockPaneSelect.append(option);
            }
            // Keep the selection if that pane still exists, else fall back to the price
            // pane rather than leaving the control pointing at a pane that is gone.
            const keep = previous !== '' && Number(previous) < count;
            lockPaneSelect.value = keep ? previous : '0';
        };
        const selectedPane = () => Number(lockPaneSelect.value || '0');
        refreshLockPanes();

        chart.subscribeVisibleRangeChange((event) => {
            const from = event.logical.from;
            const to = event.logical.to;
            const span = event.time
                ? `${new Date(event.time.from).toISOString().slice(5, 16).replace('T', ' ')} .. ${new Date(event.time.to).toISOString().slice(5, 16).replace('T', ' ')}`
                : 'off screen';
            status.title = `visible ${formatIndex(from)}..${formatIndex(to)} at ${formatIndex(event.barSpacing)}px/bar  ${span}`;
        });

        theme.addEventListener('change', () => {
            // Phase 4: the theme toggle is just an applyOptions call. Colours the
            // user set explicitly below survive the preset switch.
            restyle({ theme: theme.value }, `theme ${theme.value}`);
            document.body.dataset.theme = theme.value;
            syncSwatchesToOptions();
        });

        const upInput = document.querySelector('#candle-up');
        const downInput = document.querySelector('#candle-down');
        const wicksInput = document.querySelector('#candle-wicks');
        const bordersInput = document.querySelector('#candle-borders');
        const volumeInput = document.querySelector('#volume-visible');
        const styleInput = document.querySelector('#candle-style');
        const crosshairInput = document.querySelector('#crosshair-visible');
        const gridInput = document.querySelector('#grid-mode');
        const precisionInput = document.querySelector('#price-precision');

        /**
         * Wraps applyOptions so a rejected value surfaces in the status line
         * instead of an uncaught exception. `priceFormat.precision` and
         * `minMove` must agree, so they are always sent as a pair.
         */
        const restyle = (partial, label) => {
            try {
                chart.applyOptions(partial);
                status.textContent = label;
            } catch (error) {
                status.textContent = error instanceof Error ? error.message : 'invalid option';
                syncSwatchesToOptions();
            }
        };

        upInput.addEventListener('input', () => {
            restyle({ candlestick: { upColor: upInput.value } }, `up ${upInput.value}`);
        });
        downInput.addEventListener('input', () => {
            restyle({ candlestick: { downColor: downInput.value } }, `down ${downInput.value}`);
        });
        wicksInput.addEventListener('change', () => {
            restyle({ candlestick: { wickVisible: wicksInput.value === 'true' } }, `wicks ${wicksInput.value}`);
        });
        bordersInput.addEventListener('change', () => {
            restyle({ candlestick: { borderVisible: bordersInput.value === 'true' } }, `borders ${bordersInput.value}`);
        });
        volumeInput.addEventListener('change', () => {
            restyle({ volume: { visible: volumeInput.value === 'true' } }, `volume ${volumeInput.value}`);
        });
        styleInput.addEventListener('change', () => {
            restyle({ candlestick: { style: styleInput.value } }, `style ${styleInput.value}`);
        });
        crosshairInput.addEventListener('change', () => {
            restyle({ crosshair: { visible: crosshairInput.value === 'true' } }, `crosshair ${crosshairInput.value}`);
        });
        gridInput.addEventListener('change', () => {
            restyle({
                grid: {
                    vertLines: gridInput.value === 'both' || gridInput.value === 'vert',
                    horzLines: gridInput.value === 'both' || gridInput.value === 'horz',
                },
            }, `grid ${gridInput.value}`);
        });
        precisionInput.addEventListener('change', () => {
            const precision = Number(precisionInput.value);
            // A precision that cannot show the tick size is rejected, so widen
            // minMove together with it.
            restyle({ priceFormat: { precision, minMove: Math.pow(10, -precision) } }, `precision ${precision}`);
        });

        /** Reflects the resolved snapshot back into the controls after a theme change. */
        const syncSwatchesToOptions = () => {
            const options = chart.options();
            upInput.value = options.candlestick.upColor;
            downInput.value = options.candlestick.downColor;
            wicksInput.value = String(options.candlestick.wickVisible);
            bordersInput.value = String(options.candlestick.borderVisible);
            styleInput.value = options.candlestick.style;
            crosshairInput.value = String(options.crosshair.visible);
            gridInput.value = options.grid.vertLines && options.grid.horzLines
                ? 'both'
                : options.grid.vertLines ? 'vert' : options.grid.horzLines ? 'horz' : 'none';
            precisionInput.value = String(options.priceFormat.precision);
        };

        kind.addEventListener('change', () => {
            url.hidden = kind.value !== 'websocket';
        });

        connectButton.addEventListener('click', () => {
            if (feedController) feedController.dispose();
            chart.setData([]);
            paintReadout();
            const source = kind.value === 'mock'
                // 30 bars then a 17-hour close: enough gaps to see the break sizing and
                 // the cumulative cap at once, without a screen of whitespace.
                 ? new MockCandleSource(120, 500, 30)
                : new WebSocketCandleSource(url.value);
            feedController = new ChartFeedController(
                chart,
                source,
                (state) => { status.textContent = state; },
                (error) => {
                    status.textContent = error instanceof Error ? error.message : 'feed error';
                    console.error(error);
                },
            );
            connectButton.disabled = true;
            disconnectButton.disabled = false;
        });

        // The feed appends on its own, so the overlay is rebuilt on a timer from
        // whatever the chart currently holds rather than wired to one event.
        setInterval(() => {
            if (overlayInput.value !== 'off') setOverlays(overlayInput.value);
        }, 500);

        disconnectButton.addEventListener('click', () => {
            if (feedController) feedController.dispose();
            feedController = null;
            chart.setData([]);
            paintReadout();
            status.textContent = 'disconnected';
            connectButton.disabled = false;
            disconnectButton.disabled = true;
        });

        // Overlays are values computed elsewhere and handed to the chart as
        // { time, value } points. There is no indicator maths in the library, so
        // the demo computes its own and shows the shape a real indicator library
        // would produce: a warm-up, then a contiguous run.
        const sma = (values, period) => {
            const out = [];
            let sum = 0;
            for (let i = 0; i < values.length; i++) {
                sum += values[i];
                if (i >= period) sum -= values[i - period];
                if (i >= period - 1) out.push(sum / period);
            }
            return out;
        };
        const stddev = (values, period) => {
            const out = [];
            for (let i = period - 1; i < values.length; i++) {
                const window_ = values.slice(i - period + 1, i + 1);
                const mean = window_.reduce((a, b) => a + b, 0) / period;
                const variance = window_.reduce((a, b) => a + (b - mean) ** 2, 0) / period;
                out.push(Math.sqrt(variance));
            }
            return out;
        };
        // Wilder's RSI, the shape an indicator library hands back. Bounded 0..100
        // and nothing like a price, which is exactly why it needs its own pane.
        const rsiValues = (closes, period) => {
            if (closes.length <= period) return [];
            const out = [];
            let gain = 0, loss = 0;
            for (let i = 1; i <= period; i++) {
                const change = closes[i] - closes[i - 1];
                if (change >= 0) gain += change; else loss -= change;
            }
            gain /= period; loss /= period;
            out.push(100 - 100 / (1 + (loss === 0 ? Infinity : gain / loss)));
            for (let i = period + 1; i < closes.length; i++) {
                const change = closes[i] - closes[i - 1];
                gain = (gain * (period - 1) + Math.max(change, 0)) / period;
                loss = (loss * (period - 1) + Math.max(-change, 0)) / period;
                out.push(100 - 100 / (1 + (loss === 0 ? Infinity : gain / loss)));
            }
            return out;
        };
        const emaValues = (values, period) => {
            const out = [];
            const k = 2 / (period + 1);
            let seed = 0;
            for (let i = 0; i < period; i++) seed += values[i];
            let previous = seed / period;
            out.push(previous);
            for (let i = period; i < values.length; i++) {
                previous = values[i] * k + previous * (1 - k);
                out.push(previous);
            }
            return out;
        };

        const overlayInput = document.querySelector('#overlay-style');
        const setOverlays = (kind) => {
            if (chart.getCandleCount() === 0 || kind === 'off') {
                chart.setOverlays([]);
                return;
            }
            try {
                setOverlaysInner(kind);
            } catch (error) {
                // A refused overlay is a normal outcome here, not a crash: the pane
                // layout and the indicator have to agree, and the demo shows which
                // one is wrong rather than leaving an unhandled rejection.
                status.textContent = error instanceof Error ? error.message : 'overlay error';
            }
        };
        const setOverlaysInner = (kind) => {
            // The chart's own candles are the source, read through public API.
            const count = chart.getCandleCount();
            const closes = [];
            const times = [];
            for (let i = 0; i < count; i++) {
                const candle = chart.getCandleAt(i);
                if (!candle) continue;
                closes.push(candle.close);
                times.push(candle.time);
            }
            // The period tracks the visible window so the overlay always has
            // enough history to draw at any zoom.
            const period = Math.max(4, Math.min(40, Math.round(closes.length / 12)));
            const means = sma(closes, period);
            const start = closes.length - means.length;
            const at = (offset) => ({ time: times[start + offset], value: means[offset] });

            if (kind === 'ema') {
                chart.setOverlays([{ id: 'sma', points: means.map((_, i) => at(i)), color: '#ff9f0a' }]);
                return;
            }
            if (kind === 'bands') {
                const deviations = stddev(closes, period);
                const factor = 2;
                chart.setOverlays([
                    { id: 'upper', points: means.map((v, i) => ({ ...at(i), value: v + factor * deviations[i] })), color: '#5ac8fa' },
                    { id: 'basis', points: means.map((v, i) => at(i)), color: '#ff9f0a' },
                    { id: 'lower', points: means.map((v, i) => ({ ...at(i), value: v - factor * deviations[i] })), color: '#5ac8fa' },
                ]);
                return;
            }
            if (kind === 'stops') {
                // A stop level that flips colour with the side, which is what a
                // per-point colour is for.
                const period_ = Math.max(2, Math.round(period / 2));
                const points = means.map((value, i) => ({
                    ...at(i),
                    value: value + (i % 2 === 0 ? 1 : -1) * period_ * 0.1,
                    color: i % 2 === 0 ? '#30d158' : '#ff453a',
                }));
                chart.setOverlays([{ id: 'stops', points }]);
                return;
            }
            if (kind === 'rsi' || kind === 'rsi-macd') {
                // An indicator that does not measure price, in a pane of its own.
                // The layout is declared before the overlay names a pane in it;
                // naming a pane that was never declared is refused by the chart.
                const weights = kind === 'rsi' ? [3, 1] : [3, 1, 1];
                chart.applyOptions({ panes: { weights } });
                refreshLockPanes();
                // Keep the layout control showing what the chart is actually doing,
                // rather than leaving it claiming a pane count that was replaced.
                const paneSelect = document.querySelector('#pane-weights');
                const shown = paneSelect.querySelector(`option[value="${weights.join(',')}"]`);
                if (shown) paneSelect.value = shown.value;
                const rsiPeriod = 14;
                const rsi = rsiValues(closes, rsiPeriod);
                const rsiStart = closes.length - rsi.length;
                const overlays = [{
                    id: 'rsi',
                    pane: 1,
                    color: '#bf5af2',
                    points: rsi.map((value, i) => ({ time: times[rsiStart + i], value })),
                }];
                if (kind === 'rsi-macd') {
                    // Each average is shorter than the candle series by its own
                    // warm-up, so they are aligned by their own offsets rather than
                    // indexed as though they started at the same bar. Indexing the
                    // fast average at the slow one's offset runs off its end and
                    // produces NaN, which the chart then refuses.
                    const fast = emaValues(closes, 12);
                    const slow = emaValues(closes, 26);
                    const fastStart = closes.length - fast.length;
                    const macdStart = closes.length - slow.length;
                    const macd = slow.map((value, i) => ({
                        time: times[macdStart + i],
                        value: fast[fastStart + i] - value,
                    }));
                    const signal = emaValues(macd.map((point) => point.value), 9);
                    const signalStart = macdStart + (macd.length - signal.length);
                    overlays.push({
                        id: 'macd',
                        pane: 2,
                        color: '#5ac8fa',
                        points: signal.map((value, i) => ({ time: times[signalStart + i], value })),
                    });
                }
                chart.setOverlays(overlays);
                return;
            }
            // 'mixed': two overlays at once, one flat and one per-point.
            chart.setOverlays([
                { id: 'basis', points: means.map((_, i) => at(i)), color: '#ff9f0a' },
                {
                    id: 'signed',
                    points: means.map((value, i) => ({
                        ...at(i),
                        value: value + (i % 2 === 0 ? 1 : -1) * 0.5,
                        color: i % 2 === 0 ? '#00ffff' : '#ff00ff',
                    })),
                },
            ]);
        };
        overlayInput.addEventListener('change', () => setOverlays(overlayInput.value));

        // Pane layout is its own control, so the panes can be emptied or resized
        // without changing which indicator is selected.
        const paneInput = document.querySelector('#pane-weights');
        paneInput.addEventListener('change', () => {
            const weights = paneInput.value.split(',').map(Number);
            try {
                chart.applyOptions({ panes: { weights } });
                // The lock selector names a pane, so it follows the layout. Shrinking
                // under an indicator is refused by the chart, and the count is unchanged
                // in that case, so this is safe to call before the error is reported.
                refreshLockPanes();
                // Growing the layout is fine; shrinking it under an indicator that
                // needs the pane is refused, and the chart says so.
                if (overlayInput.value !== 'off') setOverlays(overlayInput.value);
                status.textContent = 'connected';
            } catch (error) {
                status.textContent = error instanceof Error ? error.message : 'pane error';
            }
        });

        // Decorations are annotations, not indicators: a horizontal rule the caller
        // picked a price for, and a marker on individual trades. The chart is told
        // where they go; it is not told what they mean.
        const decorationInput = document.querySelector('#decorations');
        const setDecorations = (kind) => {
            const count = chart.getCandleCount();
            if (count === 0 || kind === 'none') {
                chart.setPriceLines([]);
                chart.clearMarkers();
                chart.clearZones();
                return;
            }

            // The actual order-block rule, so the demo's output is what the concept
            // means rather than a decorative approximation: find a displacement, then
            // take the last bar that closed against it. That bar's range is the zone.
            const bars = [];
            for (let i = 0; i < count; i++) {
                const candle = chart.getCandleAt(i);
                if (candle) bars.push(candle);
            }
            const findOrderBlocks = (bars) => {
                const blocks = [];
                for (let i = 2; i < bars.length - 1; i++) {
                    const bar = bars[i];
                    const range = bar.high - bar.low;
                    if (range <= 0) continue;
                    const body = (bar.close - bar.open) / range;
                    if (body < 0.55) continue;
                    const up = body > 0;
                    // Walk back to the last bar that closed the other way.
                    for (let j = i - 1; j >= 0; j--) {
                        const back = bars[j];
                        const backUp = back.close >= back.open;
                        if (backUp !== up) {
                            blocks.push({ index: j, up, size: (bar.close - bar.open) / range });
                            break;
                        }
                    }
                }
                return blocks;
            };

            const blocks = findOrderBlocks(bars);
            // Only the most recent blocks. A zone extends right indefinitely, so on a
            // long series every zone has eventually been traded back through and
            // almost all of them end up mitigated — which is correct, and useless as
            // a demonstration. Real indicators show the recent ones, and that is also
            // what makes the chart readable.
            const recent = blocks.filter((b) => b.index > bars.length - 16);
            // A zone is mitigated once price has traded back into it, and
            // invalidated once it has closed through. Both are the caller's
            // judgement, which is why the library only renders what it is told.
            const zones = recent.map((block, n) => {
                const bar = bars[block.index];
                const later = bars.slice(block.index + 1);
                let state = 'live';
                let endedAt = null;
                if (!block.up) {
                    const through = later.findIndex((b) => b.high < bar.low);
                    const back = later.findIndex((b) => b.high > bar.low);
                    if (through >= 0) { state = 'invalidated'; endedAt = through; }
                    else if (back >= 0) { state = 'mitigated'; endedAt = back; }
                } else {
                    const through = later.findIndex((b) => b.low > bar.high);
                    const back = later.findIndex((b) => b.low < bar.high);
                    if (through >= 0) { state = 'invalidated'; endedAt = through; }
                    else if (back >= 0) { state = 'mitigated'; endedAt = back; }
                }
                return {
                    id: `ob-${n}`,
                    time: bar.time,
                    // A zone that has stopped being live also stops being drawn: there
                    // is nothing in "this was violated thirty bars ago" that needs
                    // thirty bars of width. A live zone extends right to the edge,
                    // which is what makes it read as still in effect.
                    to: endedAt === null ? null : bars[block.index + endedAt].time,
                    color: block.up ? '#3b82f6' : '#f0503a',
                    state,
                    label: state === 'live' ? (block.up ? 'demand' : 'supply') : '',
                };
            });

            const last = chart.getLastPrice();
            const lines = last === null ? [] : [
                { id: 'last-known', price: last.price, color: '#ff9f0a', lineStyle: 'solid', title: 'last' },
                { id: 'round', price: Math.round(last.price), color: '#5ac8fa' },
            ];
            const markers = [];
            if (kind === 'trades' || kind === 'both') {
                for (let i = 4; i < count; i += 7) {
                    markers.push({
                        time: bars[i].time,
                        position: i % 14 === 4 ? 'aboveBar' : 'belowBar',
                        shape: i % 14 === 4 ? 'arrowDown' : 'arrowUp',
                        color: i % 14 === 4 ? '#ff453a' : '#30d158',
                    });
                }
            }
            chart.setPriceLines(lines);
            chart.setMarkers(markers);
            if (kind === 'lines' || kind === 'trades') chart.clearZones();
            else {
                // The mock feed oscillates on an eleven-bar period, so price revisits
                // any level within a few bars and every order block it finds is
                // mitigated almost at once. That is a property of the synthetic data
                // rather than of zones, so this one is placed by hand and left live,
                // to keep the filled rendering visible beside the faded ones.
                const anchor = bars[Math.max(0, bars.length - 45)];
                zones.push({
                    id: 'live-demand',
                    time: anchor.time,
                    // The bar's own range, widened slightly. An offset from the high
                    // can land the zone above the visible price range, and a zone off
                    // the top of the pane is correctly not drawn at all.
                    top: anchor.high + 0.3,
                    bottom: anchor.low - 0.3,
                    color: '#3b82f6',
                    state: 'live',
                    label: 'demand',
                });
                chart.setZones(zones);
            }
        };
        decorationInput.addEventListener('change', () => setDecorations(decorationInput.value));

        // The price axis: linear or log, with or without inversion, and a lock.
        // A log chart is the reason the price scale lives where it does rather than
        // in a second shader program, so it is worth being able to look at.
        const scaleInput = document.querySelector('#price-scale');
        const lockInput = document.querySelector('#scale-lock');
        scaleInput.addEventListener('change', () => {
            const [mode, inverted] = scaleInput.value.split(',');
            try {
                // `autoScale` is the price scale's option, so it describes pane 0 and
                // nothing else. With a lower pane selected the control must not write it:
                // changing the price axis's mode is not a reason to release, or take
                // over, the price pane's own fitting. Pane 0's existing state is carried
                // through untouched.
                const autoScale = selectedPane() === 0
                    ? lockInput.value !== 'locked'
                    : chart.options().priceScale.autoScale;
                chart.applyOptions({
                    priceScale: { mode, inverted: inverted === '1', autoScale },
                });
                status.textContent = `scale ${chart.options().priceScale.mode}`;
            } catch (error) {
                status.textContent = `scale error: ${error instanceof Error ? error.message : error}`;
            }
        });
        lockInput.addEventListener('change', () => {
            // The lock names a pane, so it is pane 0's job only when pane 0 is selected.
            // A lower pane's lock lives in the chart and is untouched by this, which is
            // why stretching a volume pane does not stop the price chart auto-fitting.
            const pane = selectedPane();
            if (lockInput.value === 'locked') {
                // Locked to the range already on screen, which is the useful thing to
                // compare two instruments on: the same range, not a chosen one. Read per
                // pane, so an oscillator locks to its own values rather than to prices.
                const current = chart.getPaneValueRange(pane);
                if (current) chart.setPaneRange(pane, current);
            } else {
                // Releasing one pane. Explicitly per pane: a double-click on an RSI axis
                // should fit the RSI and leave a hand-stretched price scale alone.
                chart.fitPaneRange(pane);
            }
            refreshLockPanes();
        });
        setInterval(() => {
            if (decorationInput.value !== 'none') setDecorations(decorationInput.value);
        }, 700);

        window.addEventListener('beforeunload', () => {
            if (feedController) feedController.dispose();
            chart.destroy();
        });

        connectButton.click();
        // Keep the idle readout in step with a live feed that appends on its own.
        setInterval(paintReadout, 500);
    </script>
</body>
</html>
