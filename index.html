<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatrixCharts Engine Test</title>
    <style>
        body {
            background-color: #0d1117; /* Dark institutional background */
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 40px;
        }
        h2 {
            margin-bottom: 20px;
            font-weight: 500;
        }
        .feed-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            width: min(800px, 100%);
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .feed-controls select,
        .feed-controls input,
        .feed-controls button {
            min-height: 34px;
            border: 1px solid #39424e;
            border-radius: 4px;
            background: #161b22;
            color: #c9d1d9;
            padding: 0 10px;
            font: inherit;
        }
        .feed-controls input {
            flex: 1 1 240px;
        }
        .feed-controls button {
            cursor: pointer;
        }
        .feed-controls button:hover {
            border-color: #35c9a0;
        }
        #feed-status {
            margin-left: auto;
            color: #8b949e;
            font-size: 13px;
        }
        /* This is the target container we pass to the library */
        #chart-container {
            width: 800px;
            height: 500px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            resize: both;
            overflow: hidden; /* Allows you to drag the corner to test the ResizeObserver */
        }
    </style>
</head>
<body>
    <h2>MatrixCharts Layered Architecture</h2>
    <div class="feed-controls">
        <select id="feed-kind" aria-label="Feed type">
            <option value="mock">Mock feed</option>
            <option value="websocket">WebSocket</option>
        </select>
        <input id="feed-url" type="url" value="ws://localhost:8080" aria-label="WebSocket URL" hidden>
        <button id="feed-connect" type="button">Connect</button>
        <button id="feed-disconnect" type="button" disabled>Disconnect</button>
        <span id="feed-status" role="status">disconnected</span>
    </div>
    
    <!-- The Empty Container -->
    <div id="chart-container"></div>

<!-- Initialize the library -->
    <script type="module">
        import {
            Chart,
            ChartFeedController,
            MockCandleSource,
            WebSocketCandleSource,
        } from './src/index.ts';

        const chart = new Chart('chart-container');
        const kind = document.querySelector('#feed-kind');
        const url = document.querySelector('#feed-url');
        const connectButton = document.querySelector('#feed-connect');
        const disconnectButton = document.querySelector('#feed-disconnect');
        const status = document.querySelector('#feed-status');
        let feedController = null;

        kind.addEventListener('change', () => {
            url.hidden = kind.value !== 'websocket';
        });

        connectButton.addEventListener('click', () => {
            if (feedController) feedController.dispose();
            chart.setData([]);
            const source = kind.value === 'mock'
                ? new MockCandleSource()
                : new WebSocketCandleSource(url.value);
            feedController = new ChartFeedController(
                chart,
                source,
                (state) => { status.textContent = state; },
                (error) => {
                    status.textContent = error instanceof Error ? error.message : 'feed error';
                    console.error(error);
                },
            );
            connectButton.disabled = true;
            disconnectButton.disabled = false;
        });

        disconnectButton.addEventListener('click', () => {
            if (feedController) feedController.dispose();
            feedController = null;
            chart.setData([]);
            status.textContent = 'disconnected';
            connectButton.disabled = false;
            disconnectButton.disabled = true;
        });

        window.addEventListener('beforeunload', () => {
            if (feedController) feedController.dispose();
            chart.destroy();
        });

        connectButton.click();
    </script>
</body>
</html>
